<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Scribe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="split">
    <section id="book" class="half book" aria-label="Manuscript">
      <header><span id="chapter-title">Chapter 1</span></header>
      <article id="prose" aria-live="polite"></article>
    </section>
    <section class="half chat" aria-label="Conversation">
      <header><span id="mode">Narrator</span><span id="status" role="status">Ready</span><button id="gear" aria-label="Admin settings">⚙️</button></header>
      <div id="log" aria-live="polite"></div>
      <div id="pending" hidden>
        <button id="yes">Yes, save</button><button id="no">No</button>
      </div>
      <button id="mic" aria-label="Hold to talk">🎙️ Hold to talk</button>
    </section>
  </main>
  <div id="admin" hidden role="dialog" aria-modal="true" aria-label="Admin settings">
    <div class="panel">
      <div class="bar"><h2>Admin · Models</h2><button id="admin-close" aria-label="Close">✕</button></div>
      <form id="gate" hidden>
        <label>Admin token <input id="token" type="password" autocomplete="current-password" required></label>
        <button>Unlock</button>
      </form>
      <p id="admin-msg" role="status"></p>
      <div id="roles"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
