<title>Book Scribe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a top bar of big controls, then two panes (Book, Chat) in one dock. The dock splits side by side or stacked, shows one pane
   alone, and any pane can float as its own window and be attached again.
   Type: Atkinson Hyperlegible throughout. It was drawn for low vision, so every letter shape is distinct.
   Color: ink-blue on cool paper, one blue for every action, red only while listening. */
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --fg: #0F1B2A; --muted: #43546A; --line: #BCC8D6;
  --accent: #1B4FD6; --accent-fg: #FFFFFF; --live: #B3261E; --live-fg: #FFFFFF;
  --mine: #DDE7FF; --note: #FFF1C2; --note-fg: #3A2C00; --focus: #0F1B2A; --mark: #FFF3B8; --shadow: rgba(15, 27, 42, .28);
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs: 26px; --split: 55;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1521; --surface: #14212F; --fg: #EEF3F8; --muted: #AFBED0; --line: #33475C;
    --accent: #8DB0FF; --accent-fg: #07122A; --live: #FF9A90; --live-fg: #2A0805;
    --mine: #1E3358; --note: #3B3213; --note-fg: #FFEFB8; --focus: #EEF3F8; --mark: #3A3410; --shadow: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1521; --surface: #14212F; --fg: #EEF3F8; --muted: #AFBED0; --line: #33475C;
  --accent: #8DB0FF; --accent-fg: #07122A; --live: #FF9A90; --live-fg: #2A0805;
  --mine: #1E3358; --note: #3B3213; --note-fg: #FFEFB8; --focus: #EEF3F8; --mark: #3A3410; --shadow: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 20px; line-height: 1.45;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; cursor: pointer; color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, #divider:focus-visible, .para:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
h1 { margin: 0; font-size: 30px; letter-spacing: -0.01em; }
#status { margin: 0 0 0 auto; font-size: 18px; color: var(--muted); font-weight: 700; }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; flex: 1 1 100%; order: 3; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.glabel { font-size: 15px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.bar button { min-height: 52px; padding: 6px 16px; font-size: 19px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* dock + panes */
.dock { flex: 1; min-height: 0; display: grid; position: relative; }
.dock[data-layout="side"] { grid-template-columns: calc(var(--split) * 1%) 16px minmax(0, 1fr); }
.dock[data-layout="stack"] { grid-template-rows: calc(var(--split) * 1%) 16px minmax(0, 1fr); }
.dock[data-layout="one"] { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.dock[data-layout="one"] > .pane:not(.floating) { grid-area: 1 / 1; }
#divider { background: var(--line); border-radius: 8px; margin: 6px; touch-action: none; position: relative; }
#divider::after { content: ""; position: absolute; inset: 0; margin: auto; width: 4px; height: 44px; border-radius: 4px; background: var(--muted); }
.dock[data-layout="side"] #divider { cursor: col-resize; }
.dock[data-layout="stack"] #divider { cursor: row-resize; }
.dock[data-layout="stack"] #divider::after { width: 44px; height: 4px; }

.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.pane.floating { position: fixed; z-index: 30; box-shadow: 0 14px 40px var(--shadow); border-color: var(--accent); }
.phead { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-bottom: 2px solid var(--line); background: var(--bg); touch-action: none; }
.pane.floating .phead { cursor: grab; }
.phead h2 { margin: 0; font-size: 24px; flex: 1; }
.phead button { min-height: 48px; padding: 4px 16px; font-size: 18px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.grip { position: absolute; right: 0; bottom: 0; width: 32px; height: 32px; cursor: nwse-resize; touch-action: none; display: none; }
.pane.floating .grip { display: block; }
.grip::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 16px; height: 16px; border-right: 4px solid var(--muted); border-bottom: 4px solid var(--muted); border-radius: 0 0 6px 0; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.pane.floating .pbody { padding-bottom: 34px; }  /* room for the resize handle */
#empty { margin: auto; text-align: center; padding: 24px; font-size: 26px; max-width: 520px; }
#empty button { min-height: 60px; font-size: 22px; font-weight: 700; padding: 8px 24px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; margin-top: 12px; }

/* chat */
#chat { flex: 1; min-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 2px; }
.msg { max-width: 96%; padding: 12px 16px; border-radius: 18px; background: var(--bg); border: 2px solid var(--line); font-size: var(--fs); line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .who { display: block; font-size: 15px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.msg.me { align-self: flex-end; background: var(--mine); border-color: transparent; }
.msg.note { align-self: center; background: var(--note); color: var(--note-fg); border-color: transparent; font-size: 22px; text-align: center; }
.msg.note .who { display: none; }
.addbtn { display: block; margin-top: 10px; min-height: 52px; padding: 6px 18px; font-size: 20px; font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 14px; }
.addbtn:disabled { border-color: var(--line); }
.ideas, #pending { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: 58px; padding: 8px 18px; font-size: 22px; font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 16px; }
#pending button { flex: 1; min-height: 64px; font-size: 24px; font-weight: 700; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 16px; padding: 6px 16px; }
#pending button.no { background: var(--surface); color: var(--fg); border: 3px solid var(--line); }
#talk { width: 100%; min-height: 90px; display: flex; align-items: center; justify-content: center; gap: 14px; font-size: 36px; font-weight: 700; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 22px; }
#talk svg { width: 44px; height: 44px; flex: none; }
#talk.live { background: var(--live); color: var(--live-fg); }
#form { display: flex; gap: 10px; align-items: stretch; }
#msg { flex: 1; min-width: 0; min-height: 72px; resize: none; padding: 12px 14px; font: inherit; font-size: 24px; color: var(--fg); background: var(--surface); border: 3px solid var(--line); border-radius: 16px; }
#send { min-width: 120px; font-size: 28px; font-weight: 700; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 16px; padding: 0 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools button { min-height: 50px; padding: 4px 16px; font-size: 18px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.tools button[aria-pressed="true"] { border-color: var(--accent); }

/* book */
.bookbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bookbar button { min-height: 52px; padding: 4px 16px; font-size: 19px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
#chapterLabel { font-size: 20px; font-weight: 700; color: var(--muted); padding: 0 6px; }
#book { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 6px 40px; }
.para { margin: 0 0 1em; padding: 8px 12px; border-left: 6px solid transparent; border-radius: 8px; font-size: var(--fs); line-height: 1.5; overflow-wrap: anywhere; cursor: pointer; }
.para.mark { background: var(--mark); border-left-color: var(--accent); }
.para textarea { width: 100%; min-height: 140px; font: inherit; font-size: var(--fs); color: var(--fg); background: var(--surface); border: 3px solid var(--accent); border-radius: 12px; padding: 10px; resize: vertical; }
.para .row { display: flex; gap: 8px; margin-top: 8px; }
.para .row button { min-height: 52px; padding: 4px 18px; font-size: 19px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
#bookEmpty { color: var(--muted); font-size: 24px; padding: 8px 12px; }

@media (max-width: 760px) {
  h1 { font-size: 24px; } .top { gap: 4px 12px; } .bar { gap: 6px 10px; } .glabel { display: none; }
  .bar button { min-height: 46px; font-size: 17px; padding: 4px 12px; } .bar button[data-layout="side"] { display: none; }
  .phead { padding: 4px 8px 4px 14px; } .phead h2 { font-size: 20px; } .phead button { min-height: 42px; font-size: 16px; }
  #chat { min-height: 90px; }
  #talk { min-height: 76px; font-size: 30px; } #talk svg { width: 36px; height: 36px; }
  #msg { min-height: 60px; font-size: 21px; } #send { min-width: 92px; font-size: 24px; padding: 0 10px; }
  .chip { min-height: 50px; font-size: 19px; } .tools button { min-height: 46px; font-size: 16px; padding: 4px 10px; }
  .pbody { padding: 8px; } #pending button { min-height: 56px; font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) { #talk.live { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .78; } }
</style>

<main class="app">
  <header class="top">
    <h1>Book Scribe</h1>
    <p id="status" role="status">Getting ready…</p>
    <div class="bar" role="toolbar" aria-label="Page controls">
      <div class="group" role="group" aria-label="Layout">
        <span class="glabel">Layout</span>
        <button type="button" data-layout="side" aria-pressed="true">Side by side</button>
        <button type="button" data-layout="stack" aria-pressed="false">Top and bottom</button>
        <button type="button" data-layout="chat" aria-pressed="false">Chat only</button>
        <button type="button" data-layout="book" aria-pressed="false">Book only</button>
      </div>
      <div class="group" id="sizeGroup" role="group" aria-label="Size of each part">
        <span class="glabel">Size</span>
        <button type="button" id="bookWider">Book wider</button>
        <button type="button" id="chatWider">Chat wider</button>
        <button type="button" id="evenSplit">Even</button>
      </div>
      <div class="group" role="group" aria-label="Size of words">
        <span class="glabel">Words</span>
        <button type="button" id="smaller" aria-label="Smaller words">A −</button>
        <button type="button" id="bigger" aria-label="Bigger words">A +</button>
      </div>
      <button type="button" id="attachAll" hidden>Attach all</button>
    </div>
  </header>

  <div class="dock" id="dock" data-layout="side">
    <section class="pane" id="paneBook" aria-label="Book">
      <div class="phead" data-drag="book">
        <h2>Book</h2>
        <button type="button" class="detach" data-pane="book" aria-label="Detach the book into its own window">Detach</button>
      </div>
      <div class="pbody">
        <div class="bookbar" id="barSite" hidden>
          <button type="button" id="prevCh">Earlier chapter</button>
          <span id="chapterLabel">Chapter</span>
          <button type="button" id="nextCh">Later chapter</button>
        </div>
        <div class="bookbar" id="barLocal" hidden>
          <button type="button" id="copyBook">Copy all</button>
          <button type="button" id="saveBook" hidden>Save as file</button>
          <button type="button" id="clearBook">Clear book</button>
        </div>
        <div id="book" aria-live="polite"></div>
      </div>
      <div class="grip" data-grip="book" aria-hidden="true"></div>
    </section>

    <div id="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Drag to change the size of the book and the chat. Arrow keys also work." aria-valuemin="20" aria-valuemax="80" aria-valuenow="55"></div>

    <section class="pane" id="paneChat" aria-label="Chat">
      <div class="phead" data-drag="chat">
        <h2>Chat</h2>
        <button type="button" class="detach" data-pane="chat" aria-label="Detach the chat into its own window">Detach</button>
      </div>
      <div class="pbody">
        <div id="chat" aria-live="polite" aria-label="Conversation"></div>
        <div id="pending" hidden></div>
        <button id="talk" type="button" aria-label="Talk to Book Scribe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3M8.5 21.5h7"/></svg>
          <span id="talkLabel">Talk</span>
        </button>
        <form id="form">
          <label class="sr" for="msg">Type your message</label>
          <textarea id="msg" rows="2" placeholder="Or type here"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div class="tools">
          <button id="read" type="button" aria-pressed="true">Read aloud: On</button>
          <button id="stop" type="button">Stop talking</button>
          <button id="fresh" type="button">New chat</button>
        </div>
      </div>
      <div class="grip" data-grip="chat" aria-hidden="true"></div>
    </section>

    <div id="empty" hidden>
      <p>Nothing is docked here. Your parts are floating.</p>
      <button type="button" id="attachAll2">Attach all</button>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  // One page, two backends. Inside Claude it asks Claude directly and keeps your draft in this browser.
  // On your own website it talks to your Book Scribe server: /api/chat, /api/voice (microphone), /api/tts (character voices),
  // and the book pane shows the real manuscript.
  const INSTRUCTIONS =
    "You are Book Scribe, a friendly writing partner for someone who finds typing and reading hard. Answer in plain, warm, " +
    "short sentences, usually one to three. No lists, no markdown, no emoji. If they ask for writing, give one short paragraph " +
    "that could go straight into their book. Ask at most one question at a time, and wait for the answer.";
  const IDEAS = ["Help me start a story", "Describe a character for me", "Give me a writing idea"];
  const SIZES = [18, 22, 26, 32, 40];

  const state = {
    mode: null, sample: null, downloads: null, history: [], busy: false, listening: false, rec: null, recog: null, chunks: [],
    read: store.get("bs_read", "1") === "1", size: clamp(parseInt(store.get("bs_size", "2"), 10) || 2, 0, 4),
    speakToken: 0, audio: null, sid: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/-/g, ""),
    book: [], bookName: null, chapters: [], chapter: null,
  };
  let ready;

  // ================================================================ layout: dock, split, detach =====================
  // A phone opens on one part at a time; wider screens open side by side.
  const ui = Object.assign({ layout: window.matchMedia("(max-width: 760px)").matches ? "chat" : "side", split: 55, floats: { book: null, chat: null } }, (() => { try { return JSON.parse(store.get("bs_ui", "{}")); } catch (_) { return {}; } })());
  ui.floats = Object.assign({ book: null, chat: null }, ui.floats || {});
  let zTop = 30;
  const panes = { book: $("paneBook"), chat: $("paneChat") };
  const narrowQ = window.matchMedia("(max-width: 760px)");
  const saveUI = () => store.set("bs_ui", JSON.stringify(ui));

  function defaultFloat(which) {
    // Float below the docked panes' headers (so Detach / Attach stay reachable), book on the left and chat on the right.
    const top = $("dock").getBoundingClientRect().top, vw = window.innerWidth;
    const w = vw < 700 ? vw - 24 : Math.min(560, Math.round(vw * 0.46));
    return { x: which === "book" ? 12 : Math.max(8, vw - w - 12), y: Math.round(top + 72), w, h: clamp(window.innerHeight - top - 100, 280, 620) };
  }
  function placeFloat(which) {
    // Always keep the whole window on screen: a pane dragged half off the bottom would hide its own resize handle.
    const f = ui.floats[which], el = panes[which], vw = window.innerWidth, vh = window.innerHeight;
    f.w = clamp(f.w, Math.min(280, vw), vw); f.h = clamp(f.h, Math.min(240, vh), vh);
    f.x = clamp(f.x, 0, vw - f.w); f.y = clamp(f.y, 0, vh - f.h);
    Object.assign(el.style, { left: f.x + "px", top: f.y + "px", width: f.w + "px", height: f.h + "px" });
  }
  function applyUI() {
    const narrow = narrowQ.matches;
    const layout = narrow && ui.layout === "side" ? "stack" : ui.layout;  // two columns do not fit a phone
    document.querySelectorAll("[data-layout]").forEach((b) => {
      if (b.tagName !== "BUTTON") return;
      b.setAttribute("aria-pressed", String(b.dataset.layout === layout));
      if (b.dataset.layout === "side") b.disabled = narrow;
    });
    const docked = ["book", "chat"].filter((p) => !ui.floats[p]);
    const show = layout === "chat" ? docked.filter((p) => p === "chat") : layout === "book" ? docked.filter((p) => p === "book") : docked;
    const dock = $("dock");
    dock.dataset.layout = show.length === 2 ? layout : "one";
    dock.style.setProperty("--split", ui.split);
    for (const p of ["book", "chat"]) {
      const floating = !!ui.floats[p];
      panes[p].classList.toggle("floating", floating);
      panes[p].hidden = !floating && !show.includes(p);
      if (floating) placeFloat(p); else ["left", "top", "width", "height"].forEach((k) => (panes[p].style[k] = ""));
      const b = panes[p].querySelector(".detach");
      b.textContent = floating ? "Attach" : "Detach";
      b.setAttribute("aria-label", floating ? `Attach the ${p} back into the page` : `Detach the ${p} into its own window`);
    }
    // keep the DOM order book | divider | chat in the grid, and the divider only when both are docked side by side or stacked
    const dv = $("divider");
    dv.hidden = show.length !== 2;
    dv.setAttribute("aria-orientation", layout === "stack" ? "horizontal" : "vertical");
    dv.setAttribute("aria-valuenow", String(Math.round(ui.split)));
    $("sizeGroup").hidden = show.length !== 2;  // only meaningful while both parts are docked
    $("empty").hidden = show.length !== 0 || !(ui.floats.book || ui.floats.chat);
    $("attachAll").hidden = !(ui.floats.book || ui.floats.chat);
    saveUI();
  }
  function setLayout(l) { ui.layout = l; applyUI(); }
  function nudge(d) { ui.split = clamp(ui.split + d, 20, 80); applyUI(); }
  function toggleFloat(which) {
    ui.floats[which] = ui.floats[which] ? null : defaultFloat(which);
    if (ui.floats[which]) { panes[which].style.zIndex = String(++zTop); }
    applyUI();
    if (which === "chat" && !ui.floats.chat) scrollChat();
  }
  function attachAll() { ui.floats = { book: null, chat: null }; applyUI(); }

  // divider drag (mouse, touch, pen) and arrow keys
  $("divider").addEventListener("pointerdown", (e) => {
    const dv = $("divider"), dock = $("dock"); dv.setPointerCapture(e.pointerId);
    const stacked = dock.dataset.layout === "stack";
    const move = (ev) => {
      const r = dock.getBoundingClientRect();
      ui.split = clamp(((stacked ? ev.clientY - r.top : ev.clientX - r.left) / (stacked ? r.height : r.width)) * 100, 20, 80);
      dock.style.setProperty("--split", ui.split); dv.setAttribute("aria-valuenow", String(Math.round(ui.split)));
    };
    const up = () => { dv.removeEventListener("pointermove", move); dv.removeEventListener("pointerup", up); dv.removeEventListener("pointercancel", up); applyUI(); };
    dv.addEventListener("pointermove", move); dv.addEventListener("pointerup", up); dv.addEventListener("pointercancel", up);
  });
  $("divider").addEventListener("keydown", (e) => {
    const k = { ArrowLeft: -5, ArrowUp: -5, ArrowRight: 5, ArrowDown: 5 }[e.key];
    if (k) { e.preventDefault(); nudge(k); }
  });

  // moving and resizing a floating pane
  function gesture(el, which, mode) {
    el.addEventListener("pointerdown", (e) => {
      const f = ui.floats[which];
      if (!f || (mode === "move" && e.target.closest("button"))) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId); panes[which].style.zIndex = String(++zTop);
      const sx = e.clientX, sy = e.clientY, o = { ...f };
      const move = (ev) => {
        if (mode === "move") { f.x = o.x + ev.clientX - sx; f.y = o.y + ev.clientY - sy; }
        else { f.w = clamp(o.w + ev.clientX - sx, 280, window.innerWidth - f.x); f.h = clamp(o.h + ev.clientY - sy, 240, window.innerHeight - f.y); }
        placeFloat(which);
      };
      const up = () => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); saveUI(); };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    });
  }
  document.querySelectorAll("[data-drag]").forEach((h) => gesture(h, h.dataset.drag, "move"));
  document.querySelectorAll("[data-grip]").forEach((g) => gesture(g, g.dataset.grip, "size"));
  for (const p of ["book", "chat"]) panes[p].addEventListener("pointerdown", () => { if (ui.floats[p]) panes[p].style.zIndex = String(++zTop); });

  // ================================================================ chat =============================================
  function setStatus(t) { $("status").textContent = t; }
  function scrollChat() { const c = $("chat"); c.scrollTop = c.scrollHeight; }
  function bubble(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    const who = document.createElement("span");
    who.className = "who"; who.textContent = kind === "me" ? "You" : "Book Scribe";
    const body = document.createElement("span");
    body.className = "body"; body.textContent = text;
    el.append(who, body);
    $("chat").append(el); scrollChat();
    return { el, body };
  }
  function note(text) { bubble("note", text); setStatus(text); }
  function offerAdd(b) {  // inside Claude there is no server book: every answer can be added to the local draft
    if (state.mode !== "claude" || !b.body.textContent.trim() || b.body.textContent === "…") return;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "addbtn"; btn.textContent = "Add to book";
    btn.onclick = () => { addToBook(b.body.textContent); btn.textContent = "Added to the book"; btn.disabled = true; };
    b.el.append(btn);
  }
  function applySize() {
    document.documentElement.style.setProperty("--fs", SIZES[state.size] + "px");
    $("bigger").disabled = state.size === SIZES.length - 1; $("smaller").disabled = state.size === 0;
    store.set("bs_size", String(state.size));
  }
  function applyRead() {
    $("read").textContent = "Read aloud: " + (state.read ? "On" : "Off");
    $("read").setAttribute("aria-pressed", String(state.read));
    store.set("bs_read", state.read ? "1" : "0");
  }
  function showIdeas(show) {  // the starter buttons sit inside the conversation, so they scroll away with it instead of taking fixed space
    const old = $("chat").querySelector(".ideas"); if (old) old.remove();
    if (!show) return;
    const box = document.createElement("div"); box.className = "ideas"; box.setAttribute("aria-label", "Ideas to start with");
    for (const t of IDEAS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t; b.onclick = () => send(t); box.append(b);
    }
    $("chat").append(box);
  }
  function setPending(p) {
    const box = $("pending"); box.replaceChildren(); box.hidden = !p;
    if (!p) return;
    const labels = p.kind === "voice" ? [["Keep this voice", "keep it", ""], ["Try another", "try another voice", ""], ["Discard", "no", "no"]]
      : p.kind === "confirm_target" ? [["Yes, that one", "yes", ""], ["No", "no", "no"]] : [["Yes, save", "yes, save it", ""], ["No", "no", "no"]];
    for (const [label, say, cls] of labels) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.onclick = () => send(say); box.append(b);
    }
  }
  function welcome() {
    $("chat").replaceChildren();
    bubble("assistant", "Hello. I am Book Scribe. Tell me about your story, or ask me to help you write. Press Talk, or type below.");
    showIdeas(true); setPending(null);
  }
  function busy(on) { state.busy = on; $("send").disabled = on; setStatus(on ? "Thinking…" : "Ready"); }

  // --- talking back
  function stopSpeaking() {
    state.speakToken++;
    if (state.audio) { try { state.audio.pause(); } catch (_) {} }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }
  function browserSpeak(text) {
    return new Promise((done) => {
      if (!("speechSynthesis" in window) || !text) return done();
      const u = new SpeechSynthesisUtterance(text); u.rate = 0.95; u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function fetchVoice(seg) {
    try {
      const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: seg.text, speaker: seg.speaker || "assistant", draft: seg.draft || null }) });
      return r.ok ? await r.blob() : null;  // 501 = no server voice: use the browser's
    } catch (_) { return null; }
  }
  function playBlob(blob) {
    return new Promise((done) => { const a = new Audio(URL.createObjectURL(blob)); state.audio = a; a.onended = a.onerror = () => done(); a.play().catch(() => done()); });
  }
  async function speak(text, segments) {
    if (!state.read || !text) return;
    stopSpeaking();
    const token = state.speakToken, site = state.mode === "scribe";
    const segs = site && segments && segments.length ? segments.filter((s) => s.text && s.text.trim()) : [{ speaker: "assistant", text }];
    let next = site ? fetchVoice(segs[0]) : null;
    for (let i = 0; i < segs.length; i++) {
      const blob = await next;
      if (token !== state.speakToken) return;
      next = site && i + 1 < segs.length ? fetchVoice(segs[i + 1]) : null;
      if (blob) await playBlob(blob); else await browserSpeak(segs[i].text);
      if (token !== state.speakToken) return;
    }
  }

  // --- asking a model
  async function detect() {
    try {
      if (window.claude && window.claude.use) {
        state.sample = await window.claude.use("sample");
        try { state.downloads = await window.claude.use("downloads"); } catch (_) { state.downloads = null; }
      }
    } catch (_) { state.sample = null; }
    state.mode = state.sample ? "claude" : "scribe";
    $("barSite").hidden = state.mode !== "scribe";
    $("barLocal").hidden = state.mode !== "claude";
    $("saveBook").hidden = !state.downloads;
    if (state.mode === "claude") { loadLocalBook(); } else { await loadSiteBook(); }
    setStatus("Ready");
  }
  function bookContext() {
    const t = state.book.map((p) => p.text).join("\n\n");
    return t ? "\n\nThe writer's book so far (the end of it):\n" + t.slice(-3000) : "";
  }
  async function askClaude() {
    const msgs = state.history.slice(-20).map((m) => ({ role: m.role, content: m.text }));
    while (msgs.length && msgs[0].role !== "user") msgs.shift();
    msgs[0] = { role: "user", content: INSTRUCTIONS + bookContext() + "\n\nThe conversation so far:\n\n" + msgs[0].content };
    const b = bubble("assistant", "…");
    try {
      const r = await state.sample(msgs, { cache: false, onText: ({ text }) => { b.body.textContent = text; scrollChat(); } });
      b.body.textContent = r.text; offerAdd(b);
      return { text: r.text };
    } catch (e) { b.el.remove(); throw e; }
  }
  async function askServer(text) {
    const r = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, session_id: state.sid }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.detail || "server"), { code: "server", detail: j.detail });
    return j;
  }
  function explain(e) {
    if (e && e.code === "not_granted") return "Please allow Claude to answer on this page, then press Send again.";
    if (e && e.code === "rate_limited") return "That was too fast. Wait a moment, then press Send again.";
    if (e && e.detail) return e.detail;
    return "I could not get an answer. Please try again.";
  }
  function showServerReply(j) {  // chat, book and spoken reply for one answer from your server
    if (j.text) bubble("assistant", j.text);
    (j.notes || []).forEach((n) => bubble("note", n));
    setPending(j.pending || null);
    if (j.chapter) showChapter(j.chapter, j.focus, j.changed && j.changed.length);
    state.history.push({ role: "assistant", text: j.text || "" });
    speak(j.text, j.speech);
  }
  async function send(raw) {
    const text = (raw || "").trim();
    if (!text || state.busy) return;
    stopSpeaking(); await ready; showIdeas(false); setPending(null);
    $("msg").value = ""; bubble("me", text); state.history.push({ role: "user", text }); busy(true);
    try {
      if (state.mode === "claude") { const res = await askClaude(); state.history.push({ role: "assistant", text: res.text }); busy(false); speak(res.text); }
      else { const j = await askServer(text); busy(false); showServerReply(j); }
    } catch (e) { state.history.pop(); $("msg").value = text; busy(false); note(explain(e)); }
  }

  // --- the microphone
  function noMic(why) {
    setTalk(false);
    note(why || "The microphone is not available here. Tap the box below and use the microphone key on your keyboard to talk, then press Send.");
    $("msg").focus();
  }
  function setTalk(on) {
    state.listening = on; $("talk").classList.toggle("live", on);
    $("talkLabel").textContent = on ? "Listening. Tap to send" : "Talk"; setStatus(on ? "Listening…" : "Ready");
  }
  async function uploadVoice(blob) {
    busy(true);
    try {
      const fd = new FormData(); fd.append("audio", blob, "speech.webm"); fd.append("session_id", state.sid);
      const r = await fetch("/api/voice", { method: "POST", body: fd });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw Object.assign(new Error("voice"), { code: "server", detail: j.detail });
      showIdeas(false); busy(false);
      if (!j.text) { note("I did not hear anything. Tap Talk and try again."); return; }
      bubble("me", j.user_text); state.history.push({ role: "user", text: j.user_text }); showServerReply(j);
    } catch (e) { busy(false); note(explain(e)); }
  }
  async function startRecording() {
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (_) { return noMic("The microphone is blocked. Allow it in your browser, or type below."); }
    state.chunks = [];
    const rec = new MediaRecorder(stream); state.rec = rec;
    rec.ondataavailable = (e) => state.chunks.push(e.data);
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop());
      const blob = new Blob(state.chunks, { type: rec.mimeType || "audio/webm" });
      state.rec = null;
      if (blob.size < 1500) { note("That was too short. Tap Talk and try again."); return; }
      uploadVoice(blob);
    };
    rec.start(); setTalk(true);
  }
  function startRecognition(SR) {
    const r = new SR(); r.lang = navigator.language || "en-US"; r.interimResults = false; r.maxAlternatives = 1;
    let heard = "";
    r.onresult = (e) => { heard = Array.from(e.results).map((x) => x[0].transcript).join(" "); };
    r.onerror = () => noMic();
    r.onend = () => { state.recog = null; if (state.listening) setTalk(false); if (heard.trim()) send(heard); };
    state.recog = r;
    try { r.start(); setTalk(true); } catch (_) { noMic(); }
  }
  async function toggleTalk() {
    if (state.listening) {
      setTalk(false);
      if (state.rec && state.rec.state === "recording") state.rec.stop();
      if (state.recog) try { state.recog.stop(); } catch (_) {}
      return;
    }
    if (state.busy) return;
    stopSpeaking(); await ready;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (state.mode === "scribe" && navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder) return startRecording();
    if (SR) return startRecognition(SR);
    noMic();
  }

  // ================================================================ the book =========================================
  // --- inside Claude: a draft kept in this browser
  function saveLocalBook() { store.set("bs_book", JSON.stringify(state.book)); }
  function loadLocalBook() {
    try { state.book = JSON.parse(store.get("bs_book", "[]")).filter((p) => p && typeof p.text === "string"); } catch (_) { state.book = []; }
    renderLocalBook();
  }
  function addToBook(text) {
    state.book.push({ text: text.trim() }); saveLocalBook(); renderLocalBook();
    const box = $("book"); box.scrollTop = box.scrollHeight; setStatus("Added to the book");
  }
  function renderLocalBook() {
    const box = $("book"); box.replaceChildren();
    if (!state.book.length) {
      const p = document.createElement("p"); p.id = "bookEmpty";
      p.textContent = "Your book is empty. Ask Book Scribe for an idea, then press Add to book under the answer you like. Tap a paragraph to change it.";
      box.append(p); return;
    }
    state.book.forEach((p, i) => {
      const d = document.createElement("p");
      d.className = "para"; d.tabIndex = 0; d.textContent = p.text;
      const open = () => editLocal(i, d);
      d.onclick = open; d.onkeydown = (e) => { if (e.key === "Enter") open(); };
      box.append(d);
    });
  }
  function editLocal(i, node) {
    const wrap = document.createElement("div"); wrap.className = "para";
    const ta = document.createElement("textarea"); ta.value = state.book[i].text; ta.setAttribute("aria-label", "Edit this paragraph");
    const row = document.createElement("div"); row.className = "row";
    const mk = (label, fn) => { const b = document.createElement("button"); b.type = "button"; b.textContent = label; b.onclick = fn; return b; };
    row.append(
      mk("Save", () => { const t = ta.value.trim(); if (t) state.book[i].text = t; else state.book.splice(i, 1); saveLocalBook(); renderLocalBook(); }),
      mk("Cancel", renderLocalBook),
      mk("Delete", () => { state.book.splice(i, 1); saveLocalBook(); renderLocalBook(); }),
    );
    wrap.append(ta, row); node.replaceWith(wrap); ta.focus();
  }
  const bookText = () => state.book.map((p) => p.text).join("\n\n") + "\n";
  async function copyBook() {
    const text = bookText();
    try { await navigator.clipboard.writeText(text); setStatus("Copied"); $("copyBook").textContent = "Copied"; setTimeout(() => ($("copyBook").textContent = "Copy all"), 1800); }
    catch (_) {  // some viewers refuse the clipboard: show the text selected so it can be copied by hand
      const ta = document.createElement("textarea"); ta.value = text; ta.className = "para"; ta.style.minHeight = "40vh"; $("book").replaceChildren(ta); ta.select();
      setStatus("Select all and copy");
    }
  }
  async function saveBook() {
    if (!state.downloads) return;
    try { await state.downloads.save({ filename: "my-book.txt", data: bookText() }); setStatus("Saved"); } catch (_) { setStatus("Not saved"); }
  }
  let clearArmed = 0;
  function clearBook() {
    const b = $("clearBook");
    if (!clearArmed) { clearArmed = setTimeout(() => { clearArmed = 0; b.textContent = "Clear book"; }, 4000); b.textContent = "Really clear? Tap again"; return; }
    clearTimeout(clearArmed); clearArmed = 0; b.textContent = "Clear book";
    state.book = []; saveLocalBook(); renderLocalBook();
  }

  // --- on your website: the real manuscript from the server
  async function api(path) { const r = await fetch("/api" + path); if (!r.ok) throw new Error(path); return r.json(); }
  async function loadSiteBook() {
    try {
      state.bookName = (await api("/books")).default;
      state.chapters = (await api(`/books/${encodeURIComponent(state.bookName)}/chapters`)).chapters;
      if (state.chapters.length) await showChapter(state.chapters[0]);
      else siteMessage("This book has no chapters yet.");
    } catch (_) { siteMessage("I cannot reach your book. Is the Book Scribe server running?"); }
  }
  function siteMessage(t) {
    const p = document.createElement("p"); p.id = "bookEmpty"; p.textContent = t; $("book").replaceChildren(p);
    $("chapterLabel").textContent = "No chapter"; $("prevCh").disabled = $("nextCh").disabled = true;
  }
  async function showChapter(n, focus, flash) {
    if (!state.bookName) return;
    try {
      const { paragraphs } = await api(`/books/${encodeURIComponent(state.bookName)}/chapters/${n}`);
      state.chapter = n;
      const i = state.chapters.indexOf(n);
      $("chapterLabel").textContent = `Chapter ${n} of ${state.chapters.length || n}`;
      $("prevCh").disabled = i <= 0; $("nextCh").disabled = i < 0 || i >= state.chapters.length - 1;
      const box = $("book"); box.replaceChildren();
      for (const p of paragraphs) {
        const el = document.createElement("p");
        el.className = "para" + (p.id === focus ? " mark" : ""); el.id = "p_" + p.id; el.tabIndex = 0; el.textContent = p.text;
        const hear = () => speak(p.text, [{ speaker: "narrator", text: p.text }]);  // tap a paragraph to hear it
        el.onclick = hear; el.onkeydown = (e) => { if (e.key === "Enter") hear(); };
        box.append(el);
      }
      const f = focus && document.getElementById("p_" + focus);
      if (f) f.scrollIntoView({ block: "center", behavior: flash ? "smooth" : "auto" }); else box.scrollTop = 0;
    } catch (_) { siteMessage("I could not open that chapter."); }
  }
  function stepChapter(d) { const i = state.chapters.indexOf(state.chapter); const n = state.chapters[i + d]; if (n) showChapter(n); }

  // ================================================================ wiring =========================================
  document.querySelectorAll("button[data-layout]").forEach((b) => (b.onclick = () => setLayout(b.dataset.layout)));
  $("bookWider").onclick = () => nudge(10); $("chatWider").onclick = () => nudge(-10); $("evenSplit").onclick = () => { ui.split = 50; applyUI(); };
  document.querySelectorAll(".detach").forEach((b) => (b.onclick = () => toggleFloat(b.dataset.pane)));
  $("attachAll").onclick = $("attachAll2").onclick = attachAll;
  $("bigger").onclick = () => { state.size = Math.min(SIZES.length - 1, state.size + 1); applySize(); };
  $("smaller").onclick = () => { state.size = Math.max(0, state.size - 1); applySize(); };
  $("form").addEventListener("submit", (e) => { e.preventDefault(); send($("msg").value); });
  $("msg").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send($("msg").value); } });
  $("talk").onclick = toggleTalk; $("stop").onclick = stopSpeaking;
  $("read").onclick = () => { state.read = !state.read; if (!state.read) stopSpeaking(); applyRead(); };
  $("fresh").onclick = () => { stopSpeaking(); state.history = []; state.sid = state.sid.slice(0, 20) + Date.now().toString(36); welcome(); setStatus("Ready"); };
  $("prevCh").onclick = () => stepChapter(-1); $("nextCh").onclick = () => stepChapter(1);
  $("copyBook").onclick = copyBook; $("saveBook").onclick = saveBook; $("clearBook").onclick = clearBook;
  narrowQ.addEventListener("change", applyUI);
  window.addEventListener("resize", () => { for (const p of ["book", "chat"]) if (ui.floats[p]) placeFloat(p); });

  applySize(); applyRead(); applyUI(); welcome();
  ready = detect();
})();
</script>
