<title>Book Scribe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a top bar of big controls, then two panes (Book, Chat) in one dock. The dock splits side by side or stacked, shows one pane
   alone, and any pane can float as its own window and be attached again.
   Type: Atkinson Hyperlegible throughout. It was drawn for low vision, so every letter shape is distinct.
   Color: ink-blue on cool paper, one blue for every action, red only while listening. */
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --fg: #0F1B2A; --muted: #43546A; --line: #BCC8D6;
  --accent: #1B4FD6; --accent-fg: #FFFFFF; --live: #B3261E; --live-fg: #FFFFFF;
  --mine: #DDE7FF; --note: #FFF1C2; --note-fg: #3A2C00; --focus: #0F1B2A; --mark: #FFF3B8; --shadow: rgba(15, 27, 42, .28);
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --fs: 26px; --split: 55; --k: 1;  /* --k scales buttons as the words get bigger */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1521; --surface: #14212F; --fg: #EEF3F8; --muted: #AFBED0; --line: #33475C;
    --accent: #8DB0FF; --accent-fg: #07122A; --live: #FF9A90; --live-fg: #2A0805;
    --mine: #1E3358; --note: #3B3213; --note-fg: #FFEFB8; --focus: #EEF3F8; --mark: #3A3410; --shadow: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1521; --surface: #14212F; --fg: #EEF3F8; --muted: #AFBED0; --line: #33475C;
  --accent: #8DB0FF; --accent-fg: #07122A; --live: #FF9A90; --live-fg: #2A0805;
  --mine: #1E3358; --note: #3B3213; --note-fg: #FFEFB8; --focus: #EEF3F8; --mark: #3A3410; --shadow: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 20px; line-height: 1.45;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; cursor: pointer; color: var(--fg); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, textarea:focus-visible, #divider:focus-visible, .para:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.app { height: 100%; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; }
h1 { margin: 0; font-size: 30px; letter-spacing: -0.01em; }
#status { margin: 0 0 0 auto; font-size: 18px; color: var(--muted); font-weight: 700; }
@media (min-width: 761px) and (max-width: 2100px) { .glabel { display: none; } .bar { gap: 6px 10px; } .bar button { min-height: calc(46px * var(--k)); font-size: calc(18px * var(--k)); padding: 4px 13px; } }
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px; flex: 1 1 100%; order: 3; }
.group { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.glabel { font-size: 18px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
.bar button { min-height: calc(52px * var(--k)); padding: 6px 16px; font-size: calc(19px * var(--k)); font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; }
.bar button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }

/* dock + panes */
.dock { flex: 1; min-height: 0; display: grid; position: relative; }
.dock[data-layout="side"] { grid-template-columns: calc(var(--split) * 1%) 28px minmax(0, 1fr); }
.dock[data-layout="stack"] { grid-template-rows: calc(var(--split) * 1%) 28px minmax(0, 1fr); }
.dock[data-layout="one"] { grid-template: minmax(0, 1fr) / minmax(0, 1fr); }
.dock[data-layout="one"] > .pane:not(.floating) { grid-area: 1 / 1; }
#divider { background: var(--line); border-radius: 10px; margin: 0; touch-action: none; position: relative; }  /* a 28px-wide target: easy to grab with a shaky hand */
#divider::after { content: ""; position: absolute; inset: 0; margin: auto; width: 6px; height: 56px; border-radius: 4px; background: var(--muted); }
.dock[data-layout="side"] #divider { cursor: col-resize; }
.dock[data-layout="stack"] #divider { cursor: row-resize; }
.dock[data-layout="stack"] #divider { margin: 0; }
.dock[data-layout="stack"] #divider::after { width: 56px; height: 6px; }

.pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; overflow: hidden; }
.pane.floating { position: fixed; z-index: 30; box-shadow: 0 14px 40px var(--shadow); border-color: var(--accent); }
.phead { display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; border-bottom: 2px solid var(--line); background: var(--bg); touch-action: none; }
.pane.floating .phead { cursor: grab; }
.phead h2 { margin: 0; font-size: 24px; flex: 1; }
.phead button { min-height: calc(48px * var(--k)); padding: 4px 16px; font-size: calc(18px * var(--k)); font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.grip { position: absolute; right: 0; bottom: 0; width: 32px; height: 32px; cursor: nwse-resize; touch-action: none; display: none; }
.pane.floating .grip { display: block; }
.grip::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 16px; height: 16px; border-right: 4px solid var(--muted); border-bottom: 4px solid var(--muted); border-radius: 0 0 6px 0; }
.pbody { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; padding: 12px; }
.pane.floating .pbody { padding-bottom: 34px; }  /* room for the resize handle */
#empty { margin: auto; text-align: center; padding: 24px; font-size: 26px; max-width: 520px; }
#empty button { min-height: 60px; font-size: 22px; font-weight: 700; padding: 8px 24px; background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; margin-top: 12px; }

/* chat */
#chat { flex: 1; min-height: 100px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 2px; }
.msg { max-width: 96%; padding: 12px 16px; border-radius: 18px; background: var(--bg); border: 2px solid var(--line); font-size: min(var(--fs), 13vw); line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .who { display: block; font-size: 18px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
.msg.me { align-self: flex-end; background: var(--mine); border-color: transparent; }
.msg.note { align-self: center; background: var(--note); color: var(--note-fg); border-color: transparent; font-size: 22px; text-align: center; }
.msg.note .who { display: none; }
.addbtn { display: block; margin-top: 10px; min-height: calc(52px * var(--k)); padding: 6px 18px; font-size: calc(20px * var(--k)); font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 14px; }
.addbtn:disabled { border-color: var(--line); }
.ideas, #pending { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { min-height: calc(58px * var(--k)); padding: 8px 18px; font-size: calc(22px * var(--k)); font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 16px; }
/* A question for the writer: big words, two huge answers. Saying yes or no out loud works too. */
#pending { flex-direction: column; flex-wrap: nowrap; gap: 14px; padding: 18px; background: var(--note); color: var(--note-fg); border: 4px solid var(--accent); border-radius: 22px; }
#pending .ask { margin: 0; font-size: calc(32px * var(--k)); font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; max-height: 32vh; overflow-y: auto; }
#pending .answers { display: flex; flex-wrap: wrap; gap: 14px; }
#pending .or { margin: 0; font-size: calc(21px * var(--k)); font-weight: 700; }
#pending button { flex: 1 1 200px; min-height: calc(104px * var(--k)); font-size: calc(44px * var(--k)); font-weight: 700; background: var(--accent); color: var(--accent-fg); border: 4px solid var(--accent); border-radius: 20px; padding: 6px 16px; }
#pending button.no { background: var(--surface); color: var(--fg); border-color: var(--fg); }
#pending button.small { font-size: calc(30px * var(--k)); min-height: calc(84px * var(--k)); }
.bar button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
#liveBtn { width: 100%; min-height: calc(64px * var(--k)); font-size: calc(26px * var(--k)); font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 18px; }
#liveBtn[aria-pressed="true"] { background: var(--live); border-color: var(--live); color: var(--live-fg); }
#liveStatus { margin: 0; text-align: center; font-size: calc(28px * var(--k)); font-weight: 700; padding: 10px; border-radius: 14px; background: var(--mine); }
#liveStatus[data-s="capturing"] { background: var(--live); color: var(--live-fg); }
#talk { width: 100%; min-height: calc(90px * var(--k)); display: flex; align-items: center; justify-content: center; gap: 14px; font-size: calc(36px * var(--k)); font-weight: 700; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 22px; }
#talk svg { width: 44px; height: 44px; flex: none; }
#talk.live { background: var(--live); color: var(--live-fg); }
#form { display: flex; gap: 10px; align-items: stretch; }
#msg { flex: 1; min-width: 0; min-height: calc(72px * var(--k)); resize: none; padding: 12px 14px; font: inherit; font-size: calc(24px * var(--k)); color: var(--fg); background: var(--surface); border: 3px solid var(--line); border-radius: 16px; }
#send { min-width: calc(120px * var(--k)); font-size: calc(28px * var(--k)); font-weight: 700; color: var(--accent-fg); background: var(--accent); border: 0; border-radius: 16px; padding: 0 18px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; }
.tools button { min-height: calc(50px * var(--k)); padding: 4px 16px; font-size: calc(18px * var(--k)); font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
.tools button[aria-pressed="true"] { border-color: var(--accent); }

/* book */
.bookbars { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; }
#barPage { flex: 1 1 100%; }
#barPage button, #barSite button { min-height: calc(46px * var(--k)); }
.bookbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.bookbar button { min-height: calc(52px * var(--k)); padding: 4px 16px; font-size: calc(19px * var(--k)); font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
#chapterLabel { font-size: 20px; font-weight: 700; color: var(--muted); padding: 0 6px; }
/* The book is read in PAGES, like a printed book. #book is a one-column (two on a wide screen) strip cut into page-sized columns; the page buttons
   slide along it. --zoom (1 to 5) makes the words bigger, which makes more pages: 100% is normal, 500% is five times the size of the words.
   A picture is never taller than 40% of a page (--ph is the page height, set by the script), so it frames the words instead of taking the page. */
#bookWrap { --zoom: 1; flex: 1; min-height: 0; display: flex; padding: 18px 30px; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; box-shadow: 0 2px 10px var(--shadow); outline-offset: 3px; }
#book { flex: 1; min-width: 0; height: 100%; overflow: hidden; position: relative; column-fill: auto; column-gap: 48px; }
#book.one { column-count: auto; }
#pgLabel { font-size: 20px; font-weight: 700; color: var(--muted); padding: 0 8px; min-width: 9.5em; text-align: center; }
.bookbar .sep { flex: 1 1 8px; }
#zmLabel { font-size: 20px; font-weight: 700; color: var(--muted); min-width: 3.4em; text-align: center; }
.para { margin: 0 0 .8em; padding: 4px 10px; border-left: 6px solid transparent; border-radius: 8px; font-size: calc(min(var(--fs), 13vw) * var(--zoom)); line-height: 1.5; overflow-wrap: anywhere; cursor: pointer; orphans: 2; widows: 2; }
figure.para { margin: .3em 0 .9em; padding: 0; text-align: center; cursor: pointer; break-inside: avoid; }
figure.para img { display: block; margin: 0 auto; max-width: 100%; max-height: calc(var(--ph, 600px) * .4); width: auto; height: auto; object-fit: contain; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); }
figure.para figcaption { font-size: calc(var(--fs) * .72 * var(--zoom)); color: var(--muted); font-style: italic; margin-top: 4px; line-height: 1.3; }
.chatpic { display: block; max-width: 100%; max-height: 34vh; margin: 6px 0 10px; border-radius: 10px; border: 2px solid var(--line); }
.para.mark { background: var(--mark); border-left-color: var(--accent); }
.para textarea { width: 100%; min-height: 140px; font: inherit; font-size: min(var(--fs), 13vw); color: var(--fg); background: var(--surface); border: 3px solid var(--accent); border-radius: 12px; padding: 10px; resize: vertical; }
.para .row { display: flex; gap: 8px; margin-top: 8px; }
.para .row button { min-height: 52px; padding: 4px 18px; font-size: 19px; font-weight: 700; background: var(--surface); border: 2px solid var(--line); border-radius: 12px; }
#bookEmpty { color: var(--muted); font-size: 24px; padding: 8px 12px; }

@media (max-width: 760px) {
  h1 { font-size: 24px; } .top { gap: 4px 12px; } .bar { gap: 6px 10px; } .glabel { display: none; }
  .bar button { min-height: calc(46px * var(--k)); font-size: calc(18px * var(--k)); padding: 4px 12px; } .bar button[data-layout="side"] { display: none; }
  .phead { padding: 4px 8px 4px 14px; } .phead h2 { font-size: 20px; } .phead button { min-height: calc(48px * var(--k)); font-size: calc(18px * var(--k)); }
  #chat { min-height: 90px; }
  #talk { min-height: calc(76px * var(--k)); font-size: calc(30px * var(--k)); } #talk svg { width: 36px; height: 36px; }
  #msg { min-height: calc(60px * var(--k)); font-size: calc(22px * var(--k)); } #send { min-width: calc(92px * var(--k)); font-size: calc(24px * var(--k)); padding: 0 10px; }
  .chip { min-height: calc(50px * var(--k)); font-size: calc(20px * var(--k)); } .tools button { min-height: calc(46px * var(--k)); font-size: calc(18px * var(--k)); padding: 4px 10px; }
  .pbody { padding: 8px; } #pending { padding: 12px; } #pending .ask { font-size: calc(24px * var(--k)); } #pending button { min-height: calc(80px * var(--k)); font-size: calc(34px * var(--k)); }
}
/* Looks chosen by the writer (or by the agent when they say they can't see). They come AFTER the dark-mode blocks so they win. */
:root[data-contrast="high"] {  /* black on white, heavy lines */
  --bg: #FFFFFF; --surface: #FFFFFF; --fg: #000000; --muted: #1A1A1A; --line: #000000; --accent: #0A2BA8; --accent-fg: #FFFFFF;
  --live: #9B0000; --live-fg: #FFFFFF; --mine: #E4EBFF; --note: #FFE680; --note-fg: #000000; --focus: #000000; --mark: #FFE14D; --shadow: rgba(0, 0, 0, .5); color-scheme: light;
}
:root[data-contrast="dark"] {  /* yellow and white on black, the combination many people with low vision find easiest */
  --bg: #000000; --surface: #000000; --fg: #FFFFFF; --muted: #F2F2F2; --line: #FFFFFF; --accent: #FFE600; --accent-fg: #000000;
  --live: #FF7A70; --live-fg: #000000; --mine: #2A2300; --note: #FFE600; --note-fg: #000000; --focus: #FFE600; --mark: #4D4400; --shadow: rgba(255, 255, 255, .25); color-scheme: dark;
}
:root[data-contrast="high"] .msg, :root[data-contrast="high"] .pane, :root[data-contrast="dark"] .msg, :root[data-contrast="dark"] .pane,
:root[data-contrast="high"] button, :root[data-contrast="dark"] button { border-width: 3px; }
:root[data-bold="1"] body { font-weight: 700; }
:root[data-spacing="1"] .msg, :root[data-spacing="1"] .para { line-height: 1.7; letter-spacing: .02em; word-spacing: .08em; }
:root[data-spacing="2"] .msg, :root[data-spacing="2"] .para { line-height: 2; letter-spacing: .05em; word-spacing: .16em; }
/* Big print (words 40px or more): the controls must not eat the screen, or the conversation has no room. Fewer, calmer controls; the voice is primary. */
:root[data-big="1"] #sizeGroup, :root[data-big="1"] #attachAll, :root[data-big="1"] .glabel, :root[data-big="1"] .bar button[data-layout="side"], :root[data-big="1"] .bar button[data-layout="stack"] { display: none !important; }
:root[data-big="1"] h1 { font-size: 28px; }
:root[data-big="1"] .top { gap: 4px 12px; }
:root[data-big="1"] .bar { gap: 6px 10px; }
:root[data-big="1"] .bar button { min-height: 52px; font-size: 22px; padding: 4px 14px; }
:root[data-big="1"] .bookbar button { min-height: 52px; font-size: 22px; padding: 4px 14px; }
:root[data-big="1"] #chapterLabel { font-size: 24px; }
:root[data-big="1"] .phead button { min-height: 46px; font-size: 20px; }
:root[data-big="1"] #liveBtn { min-height: 54px; font-size: 24px; }
:root[data-big="1"] #talk { min-height: 84px; font-size: 38px; }
:root[data-big="1"] #talk svg { width: 40px; height: 40px; }
:root[data-big="1"] #form { display: none; }
:root[data-big="1"] #form.open { display: flex; }
:root[data-big="1"] #msg { min-height: 64px; font-size: 28px; }
:root[data-big="1"] #send { min-width: 100px; font-size: 28px; }
:root[data-big="1"] .tools { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; }
:root[data-big="1"] .tools button { min-height: 48px; font-size: 20px; flex: none; }
:root[data-big="1"] #pending { padding: 12px; gap: 10px; }
:root[data-big="1"] #pending .ask { font-size: 30px; }
:root[data-big="1"] #pending button { min-height: 84px; font-size: 36px; }
#typeBtn { display: none; }
:root[data-big="1"] #typeBtn { display: inline-flex; align-items: center; }
:root[data-simple="1"] #layoutGroup, :root[data-simple="1"] #sizeGroup, :root[data-simple="1"] #attachAll { display: none !important; }  /* a simpler screen: fewer buttons */
.para.mark { outline: 3px solid var(--accent); outline-offset: -3px; }
.para[data-n]::before { content: attr(data-n); display: inline-flex; align-items: center; justify-content: center; min-width: 1.5em; height: 1.5em; margin-right: .5em; border-radius: 50%; background: var(--accent); color: var(--accent-fg); font-weight: 700; font-size: .7em; vertical-align: middle; }
.refs, .ideas-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.refs button, .ideas-row button { min-height: calc(52px * var(--k)); padding: 6px 16px; font-size: calc(20px * var(--k)); font-weight: 700; background: var(--surface); border: 3px solid var(--accent); border-radius: 14px; text-align: left; }
.ideas-row button.use { flex: 1 1 100%; }
@media (prefers-reduced-motion: no-preference) { #talk.live { animation: pulse 1.4s ease-in-out infinite; } }
@keyframes pulse { 50% { opacity: .78; } }
</style>

<main class="app">
  <header class="top">
    <h1>Book Scribe</h1>
    <p id="status" role="status">Getting ready…</p>
    <div class="bar" role="toolbar" aria-label="Page controls">
      <div class="group" id="layoutGroup" role="group" aria-label="Layout">
        <span class="glabel">Layout</span>
        <button type="button" data-layout="side" aria-pressed="true">Side by side</button>
        <button type="button" data-layout="stack" aria-pressed="false">Top and bottom</button>
        <button type="button" data-layout="chat" aria-pressed="false">Chat only</button>
        <button type="button" data-layout="book" aria-pressed="false">Book only</button>
      </div>
      <div class="group" id="sizeGroup" role="group" aria-label="Size of each part">
        <span class="glabel">Size</span>
        <button type="button" id="bookWider">Book wider</button>
        <button type="button" id="chatWider">Chat wider</button>
        <button type="button" id="evenSplit">Even</button>
      </div>
      <div class="group" role="group" aria-label="Size of words">
        <span class="glabel">Words</span>
        <button type="button" id="smaller" aria-label="Smaller words">A −</button>
        <button type="button" id="bigger" aria-label="Bigger words">A +</button>
        <button type="button" id="simpleBtn" aria-pressed="false">Simple screen</button>
      </div>
      <div class="group" id="siteTools" role="group" aria-label="Account and settings" hidden></div>
      <button type="button" id="attachAll" hidden>Attach all</button>
    </div>
  </header>

  <div class="dock" id="dock" data-layout="side">
    <section class="pane" id="paneBook" aria-label="Book">
      <div class="phead" data-drag="book">
        <h2>Book</h2>
        <button type="button" class="detach" data-pane="book" aria-label="Detach the book into its own window">Detach</button>
      </div>
      <div class="pbody">
        <div class="bookbars">
        <div class="bookbar" id="barSite" hidden>
          <button type="button" id="prevCh">Earlier chapter</button>
          <span id="chapterLabel">Chapter</span>
          <button type="button" id="nextCh">Later chapter</button>
        </div>
        <div class="bookbar" id="barLocal" hidden>
          <button type="button" id="copyBook">Copy all</button>
          <button type="button" id="saveBook" hidden>Save as file</button>
          <button type="button" id="clearBook">Clear book</button>
        </div>
        <div class="bookbar" id="barPage">
          <button type="button" id="pgPrev">Previous page</button>
          <span id="pgLabel" role="status">Page 1 of 1</span>
          <button type="button" id="pgNext">Next page</button>
          <span class="sep"></span>
          <button type="button" id="zmOut" aria-label="Smaller words in the book">Text −</button>
          <span id="zmLabel" role="status">100%</span>
          <button type="button" id="zmIn" aria-label="Bigger words in the book">Text +</button>
        </div>
        </div>
        <div id="bookWrap" tabindex="0" aria-label="The book. Left and right arrow keys turn the page."><div id="book" aria-live="polite"></div></div>
      </div>
      <div class="grip" data-grip="book" aria-hidden="true"></div>
    </section>

    <div id="divider" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Drag to change the size of the book and the chat. Arrow keys also work." aria-valuemin="20" aria-valuemax="80" aria-valuenow="55"></div>

    <section class="pane" id="paneChat" aria-label="Chat">
      <div class="phead" data-drag="chat">
        <h2>Chat</h2>
        <button type="button" class="detach" data-pane="chat" aria-label="Detach the chat into its own window">Detach</button>
      </div>
      <div class="pbody">
        <div id="chat" aria-live="polite" aria-label="Conversation"></div>
        <div id="pending" hidden></div>
        <button id="liveBtn" type="button" aria-pressed="false" hidden>Start live talk</button>
        <p id="liveStatus" role="status" data-s="idle" hidden></p>
        <button id="talk" type="button" aria-label="Talk to Book Scribe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 11.5a7 7 0 0 0 14 0M12 18.5v3M8.5 21.5h7"/></svg>
          <span id="talkLabel">Talk</span>
        </button>
        <form id="form">
          <label class="sr" for="msg">Type your message</label>
          <textarea id="msg" rows="2" placeholder="Or type here"></textarea>
          <button id="send" type="submit">Send</button>
        </form>
        <div class="tools">
          <button id="read" type="button" aria-pressed="true">Read aloud: On</button>
          <button id="stop" type="button">Stop talking</button>
          <button id="typeBtn" type="button" aria-label="Show the keyboard box to type a message">Keyboard</button>
          <button id="fresh" type="button" aria-label="Clear the chat. I will still remember our work.">Clear chat</button>
        </div>
      </div>
      <div class="grip" data-grip="chat" aria-hidden="true"></div>
    </section>

    <div id="empty" hidden>
      <p>Nothing is docked here. Your parts are floating.</p>
      <button type="button" id="attachAll2">Attach all</button>
    </div>
  </div>
</main>

<script>
(() => {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (_) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (_) {} },
  };
  const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

  // One page, two backends. Inside Claude it asks Claude directly and keeps your draft in this browser.
  // On your own website it talks to your Book Scribe server: /api/chat, /api/voice (microphone), /api/tts (character voices),
  // and the book pane shows the real manuscript.
  const INSTRUCTIONS =
    "You are Book Scribe, a friendly writing partner for someone who finds typing and reading hard. Answer in plain, warm, " +
    "short sentences, usually one to three. No lists, no markdown, no emoji. If they ask for writing, give one short paragraph " +
    "that could go straight into their book. Ask at most one question at a time, and wait for the answer.";
  const IDEAS = ["Help me start a story", "Describe a character for me", "Give me a writing idea"];
  const SIZES = [18, 22, 26, 32, 40, 52, 64, 80];  // 8 steps: the top ones are for people who need very large print
  const SCALE = [1, 1, 1, 1.1, 1.25, 1.45, 1.65, 1.85];  // how much the buttons grow with the words

  const state = {
    mode: null, sample: null, downloads: null, history: [], busy: false, listening: false, rec: null, recog: null, chunks: [],
    read: store.get("bs_read", "1") === "1", size: clamp(parseInt(store.get("bs_size", "2"), 10) || 2, 0, 7),
    look: { zoom: 100, contrast: "normal", bold: false, spacing: 0, simple: false, rate: 1, theme: "auto", layout: "" }, rate: 1,
    speakToken: 0, audio: null, sid: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())).replace(/-/g, ""),
    book: [], bookName: null, chapters: [], chapter: null,
  };
  let ready;

  // ================================================================ layout: dock, split, detach =====================
  // A phone opens on one part at a time; wider screens open side by side.
  const ui = Object.assign({ layout: window.matchMedia("(max-width: 760px)").matches ? "chat" : "side", split: window.innerWidth >= 1700 ? 62 : 55, floats: { book: null, chat: null } }, (() => { try { return JSON.parse(store.get("bs_ui", "{}")); } catch (_) { return {}; } })());
  ui.floats = Object.assign({ book: null, chat: null }, ui.floats || {});
  let zTop = 30;
  const panes = { book: $("paneBook"), chat: $("paneChat") };
  const narrowQ = window.matchMedia("(max-width: 760px)");
  const saveUI = () => store.set("bs_ui", JSON.stringify(ui));

  function defaultFloat(which) {
    // Float below the docked panes' headers (so Detach / Attach stay reachable), book on the left and chat on the right.
    const top = $("dock").getBoundingClientRect().top, vw = window.innerWidth;
    const w = vw < 700 ? vw - 24 : Math.min(560, Math.round(vw * 0.46));
    return { x: which === "book" ? 12 : Math.max(8, vw - w - 12), y: Math.round(top + 72), w, h: clamp(window.innerHeight - top - 100, 280, 620) };
  }
  function placeFloat(which) {
    // Always keep the whole window on screen: a pane dragged half off the bottom would hide its own resize handle.
    const f = ui.floats[which], el = panes[which], vw = window.innerWidth, vh = window.innerHeight;
    f.w = clamp(f.w, Math.min(280, vw), vw); f.h = clamp(f.h, Math.min(240, vh), vh);
    f.x = clamp(f.x, 0, vw - f.w); f.y = clamp(f.y, 0, vh - f.h);
    Object.assign(el.style, { left: f.x + "px", top: f.y + "px", width: f.w + "px", height: f.h + "px" });
  }
  function applyUI() {
    const narrow = narrowQ.matches;
    const layout = narrow && ui.layout === "side" ? "stack" : ui.layout;  // two columns do not fit a phone
    document.querySelectorAll("[data-layout]").forEach((b) => {
      if (b.tagName !== "BUTTON") return;
      b.setAttribute("aria-pressed", String(b.dataset.layout === layout));
      if (b.dataset.layout === "side") b.disabled = narrow;
    });
    const docked = ["book", "chat"].filter((p) => !ui.floats[p]);
    const show = layout === "chat" ? docked.filter((p) => p === "chat") : layout === "book" ? docked.filter((p) => p === "book") : docked;
    const dock = $("dock");
    dock.dataset.layout = show.length === 2 ? layout : "one";
    dock.style.setProperty("--split", ui.split);
    for (const p of ["book", "chat"]) {
      const floating = !!ui.floats[p];
      panes[p].classList.toggle("floating", floating);
      panes[p].hidden = !floating && !show.includes(p);
      if (floating) placeFloat(p); else ["left", "top", "width", "height"].forEach((k) => (panes[p].style[k] = ""));
      const b = panes[p].querySelector(".detach");
      b.textContent = floating ? "Attach" : "Detach";
      b.setAttribute("aria-label", floating ? `Attach the ${p} back into the page` : `Detach the ${p} into its own window`);
    }
    // keep the DOM order book | divider | chat in the grid, and the divider only when both are docked side by side or stacked
    const dv = $("divider");
    dv.hidden = show.length !== 2;
    dv.setAttribute("aria-orientation", layout === "stack" ? "horizontal" : "vertical");
    dv.setAttribute("aria-valuenow", String(Math.round(ui.split)));
    $("sizeGroup").hidden = show.length !== 2;  // only meaningful while both parts are docked
    $("empty").hidden = show.length !== 0 || !(ui.floats.book || ui.floats.chat);
    $("attachAll").hidden = !(ui.floats.book || ui.floats.chat);
    saveUI();
  }
  function setLayout(l) { ui.layout = l; applyUI(); }
  function nudge(d) { ui.split = clamp(ui.split + d, 20, 80); applyUI(); }
  function toggleFloat(which) {
    ui.floats[which] = ui.floats[which] ? null : defaultFloat(which);
    if (ui.floats[which]) { panes[which].style.zIndex = String(++zTop); }
    applyUI();
    if (which === "chat" && !ui.floats.chat) scrollChat();
  }
  function attachAll() { ui.floats = { book: null, chat: null }; applyUI(); }

  // divider drag (mouse, touch, pen) and arrow keys
  $("divider").addEventListener("pointerdown", (e) => {
    const dv = $("divider"), dock = $("dock"); dv.setPointerCapture(e.pointerId);
    const stacked = dock.dataset.layout === "stack";
    const move = (ev) => {
      const r = dock.getBoundingClientRect();
      ui.split = clamp(((stacked ? ev.clientY - r.top : ev.clientX - r.left) / (stacked ? r.height : r.width)) * 100, 20, 80);
      dock.style.setProperty("--split", ui.split); dv.setAttribute("aria-valuenow", String(Math.round(ui.split)));
    };
    const up = () => { dv.removeEventListener("pointermove", move); dv.removeEventListener("pointerup", up); dv.removeEventListener("pointercancel", up); applyUI(); };
    dv.addEventListener("pointermove", move); dv.addEventListener("pointerup", up); dv.addEventListener("pointercancel", up);
  });
  $("divider").addEventListener("keydown", (e) => {
    const k = { ArrowLeft: -5, ArrowUp: -5, ArrowRight: 5, ArrowDown: 5 }[e.key];
    if (k) { e.preventDefault(); nudge(k); }
  });

  // moving and resizing a floating pane
  function gesture(el, which, mode) {
    el.addEventListener("pointerdown", (e) => {
      const f = ui.floats[which];
      if (!f || (mode === "move" && e.target.closest("button"))) return;
      e.preventDefault(); el.setPointerCapture(e.pointerId); panes[which].style.zIndex = String(++zTop);
      const sx = e.clientX, sy = e.clientY, o = { ...f };
      const move = (ev) => {
        if (mode === "move") { f.x = o.x + ev.clientX - sx; f.y = o.y + ev.clientY - sy; }
        else { f.w = clamp(o.w + ev.clientX - sx, 280, window.innerWidth - f.x); f.h = clamp(o.h + ev.clientY - sy, 240, window.innerHeight - f.y); }
        placeFloat(which);
      };
      const up = () => { el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up); saveUI(); };
      el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
    });
  }
  document.querySelectorAll("[data-drag]").forEach((h) => gesture(h, h.dataset.drag, "move"));
  document.querySelectorAll("[data-grip]").forEach((g) => gesture(g, g.dataset.grip, "size"));
  for (const p of ["book", "chat"]) panes[p].addEventListener("pointerdown", () => { if (ui.floats[p]) panes[p].style.zIndex = String(++zTop); });

  // On your website every request to the server goes through here. A 401 means "log in", which the site's login screen handles.
  window.BS = window.BS || {};
  async function siteFetch(url, opts) {
    const r = await fetch(url, opts);
    if (r.status === 401) {
      window.BS.authNeeded = true;
      if (window.BS.needLogin) window.BS.needLogin();
      throw Object.assign(new Error("auth"), { code: "auth", detail: "Please log in." });
    }
    return r;
  }

  // ================================================================ chat =============================================
  function setStatus(t) { $("status").textContent = t; }
  function scrollChat() { const c = $("chat"); c.scrollTop = c.scrollHeight; }
  function bubble(kind, text) {
    const el = document.createElement("div");
    el.className = "msg " + kind;
    const who = document.createElement("span");
    who.className = "who"; who.textContent = kind === "me" ? "You" : "Book Scribe";
    const body = document.createElement("span");
    body.className = "body"; body.textContent = text;
    el.append(who, body);
    $("chat").append(el);
    const c = $("chat");
    if (kind === "assistant" && el.offsetHeight > c.clientHeight * 0.6) el.scrollIntoView({ block: "start" });  // a long reply at big print: start at its beginning
    else scrollChat();
    return { el, body };
  }
  function note(text) { bubble("note", text); setStatus(text); }
  function offerAdd(b) {  // inside Claude there is no server book: every answer can be added to the local draft
    if (state.mode !== "claude" || !b.body.textContent.trim() || b.body.textContent === "…") return;
    const btn = document.createElement("button");
    btn.type = "button"; btn.className = "addbtn"; btn.textContent = "Add to book";
    btn.onclick = () => { addToBook(b.body.textContent); btn.textContent = "Added to the book"; btn.disabled = true; };
    b.el.append(btn);
  }
  function applySize() {
    state.size >= 4 ? document.documentElement.setAttribute("data-big", "1") : document.documentElement.removeAttribute("data-big");  // words of 40 pixels or more: the compact big-print layout
    const root = document.documentElement;
    root.style.setProperty("--fs", SIZES[state.size] + "px");
    root.style.setProperty("--k", String(SCALE[state.size]));
    $("bigger").disabled = state.size === SIZES.length - 1; $("smaller").disabled = state.size === 0;
    store.set("bs_size", String(state.size));
  }
  // The whole look (size, colours, bold, spacing, simple screen, speech speed). Set from the buttons, from Settings, or by the agent when
  // the writer says they cannot see; the server keeps it so it follows the writer to any device.
  function currentLook() { return { size: state.size, ...state.look }; }
  function applyLook(l, remember = true) {
    if (!l) return;
    if (typeof l.size === "number") state.size = clamp(Math.round(l.size), 0, SIZES.length - 1);
    const prev = state.look.layout;
    const ZM = [100, 125, 150, 200, 250, 300, 400, 500];
    state.look.zoom = ZM.reduce((a, z) => (Math.abs(z - (l.zoom || 100)) < Math.abs(a - (l.zoom || 100)) ? z : a), 100);
    Object.assign(state.look, { contrast: l.contrast || "normal", bold: !!l.bold, spacing: l.spacing || 0, simple: !!l.simple, rate: l.rate || 1, theme: l.theme || "auto", layout: l.layout || "" });
    state.rate = state.look.rate;
    const root = document.documentElement;
    state.look.contrast === "normal" ? root.removeAttribute("data-contrast") : root.setAttribute("data-contrast", state.look.contrast);
    state.look.bold ? root.setAttribute("data-bold", "1") : root.removeAttribute("data-bold");
    state.look.spacing ? root.setAttribute("data-spacing", String(state.look.spacing)) : root.removeAttribute("data-spacing");
    state.look.simple ? root.setAttribute("data-simple", "1") : root.removeAttribute("data-simple");
    state.look.theme === "auto" ? root.removeAttribute("data-theme") : root.setAttribute("data-theme", state.look.theme);
    $("simpleBtn").setAttribute("aria-pressed", String(state.look.simple));
    applySize();
    $("bookWrap").style.setProperty("--zoom", String(state.look.zoom / 100)); $("zmLabel").textContent = state.look.zoom + "%";
    $("zmOut").disabled = state.look.zoom <= 100; $("zmIn").disabled = state.look.zoom >= 500;
    layoutBook(true);
    if (state.look.layout && state.look.layout !== prev) setLayout(state.look.layout);
    if (remember) { store.set("bs_look", JSON.stringify(currentLook())); if (window.BS && window.BS.onLookChange) window.BS.onLookChange(currentLook()); }
  }
  function applyRead() {
    $("read").textContent = "Read aloud: " + (state.read ? "On" : "Off");
    $("read").setAttribute("aria-pressed", String(state.read));
    store.set("bs_read", state.read ? "1" : "0");
  }
  function showIdeas(show) {  // the starter buttons sit inside the conversation, so they scroll away with it instead of taking fixed space
    const old = $("chat").querySelector(".ideas"); if (old) old.remove();
    if (!show) return;
    const box = document.createElement("div"); box.className = "ideas"; box.setAttribute("aria-label", "Ideas to start with");
    for (const t of IDEAS) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "chip"; b.textContent = t; b.onclick = () => send(t); box.append(b);
    }
    $("chat").append(box);
  }
  const ANSWERS = {  // what each kind of question offers: [button text, what is sent, style]
    voice: [["Keep this voice", "keep it", "small"], ["Try another", "try another voice", "small"], ["Discard", "no", "no small"]],
    confirm_target: [["Yes, that one", "yes", ""], ["No", "no", "no"]],
    file: [["Yes, add it", "yes", ""], ["No", "no", "no"]],
    family: [["Yes, add them", "yes", ""], ["No", "no", "no"]],
    wiki: [["Yes, save it", "yes", ""], ["No", "no", "no"]],
    delete: [["Yes, delete it", "yes", ""], ["No", "no", "no"]],
    picture: [["Yes, use it", "yes", ""], ["No", "no", "no"]],
    move: [["Yes, move it", "yes", ""], ["No", "no", "no"]],
  };
  function setPending(p, question) {
    const box = $("pending"); box.replaceChildren(); box.hidden = !p;
    if (!p) return;
    const labels = ANSWERS[p.kind] || [["Yes, save", "yes, save it", ""], ["No", "no", "no"]];
    const q = document.createElement("p"); q.className = "ask"; q.textContent = (question || "Is that right?").slice(0, 260);
    const row = document.createElement("div"); row.className = "answers";
    for (const [label, say, cls] of labels) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = label; if (cls) b.className = cls; b.onclick = () => send(say); row.append(b);
    }
    const or = document.createElement("p"); or.className = "or"; or.textContent = "You can also just say yes or no.";
    box.setAttribute("role", "group"); box.setAttribute("aria-label", "Please answer");
    box.append(q, row, or);
    if (!document.activeElement || document.activeElement === document.body || document.activeElement.id === "talk") row.firstChild.focus({ preventScroll: true });
  }
  // One long conversation: the server keeps it (and a summary of the older part), so a reload or a new device picks up where we left off.
  async function restoreChat() {
    if (state.mode !== "scribe" || !state.bookName) return false;
    try {
      const r = await siteFetch(`/api/books/${encodeURIComponent(state.bookName)}/chat`);
      const j = await r.json();
      if (!r.ok || !j.messages || !j.messages.length) return false;
      $("chat").replaceChildren(); state.history = [];
      for (const m of j.messages) { bubble(m.role === "user" ? "me" : "assistant", m.text); state.history.push({ role: m.role, text: m.text }); }
      showIdeas(false); setPending(null);
      return true;
    } catch (_) { return false; }
  }
  async function clearChat() {  // empties the screen only: the agent folds the talk into its memory first and the journal keeps every word
    stopSpeaking();
    if (state.mode === "scribe" && state.bookName) { try { await siteFetch(`/api/books/${encodeURIComponent(state.bookName)}/chat/clear`, { method: "POST" }); } catch (_) {} }
    state.history = []; welcome();
    if (state.mode === "scribe") bubble("note", "The chat is clear. I still remember everything we have worked on.");
    setStatus("Ready");
  }
  function welcome() {
    $("chat").replaceChildren();
    bubble("assistant", "Hello. I am Book Scribe. Tell me about your story, or ask me to help you write. Press Talk, or type below.");
    showIdeas(true); setPending(null);
  }
  function busy(on) { state.busy = on; $("send").disabled = on; setStatus(on ? "Thinking…" : "Ready"); }

  // --- talking back
  function stopSpeaking() {
    state.speakToken++; state.speaking = false;
    if (state.audio) { try { state.audio.pause(); } catch (_) {} }
    if ("speechSynthesis" in window) speechSynthesis.cancel();
  }
  function browserSpeak(text) {
    return new Promise((done) => {
      if (!("speechSynthesis" in window) || !text) return done();
      const u = new SpeechSynthesisUtterance(text); u.rate = 0.95 * (state.rate || 1); u.onend = u.onerror = () => done();
      speechSynthesis.speak(u);
    });
  }
  async function fetchVoice(seg) {
    try {
      const r = await fetch("/api/tts", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text: seg.text, speaker: seg.speaker || "assistant", draft: seg.draft || null }) });
      return r.ok ? await r.blob() : null;  // 501 = no server voice: use the browser's
    } catch (_) { return null; }
  }
  function playBlob(blob) {
    return new Promise((done) => { const a = new Audio(URL.createObjectURL(blob)); state.audio = a; a.onended = a.onerror = () => done(); a.play().catch(() => done()); });
  }
  async function speak(text, segments) {
    if (!state.read || !text) return;
    stopSpeaking();
    const token = state.speakToken, site = state.mode === "scribe";
    state.speaking = true; setLiveUI();
    try { await speakSegments(text, segments, token, site); } finally { if (token === state.speakToken) { state.speaking = false; setLiveUI(); } }
  }
  async function speakSegments(text, segments, token, site) {
    const segs = site && segments && segments.length ? segments.filter((s) => s.text && s.text.trim()) : [{ speaker: "assistant", text }];
    let next = site ? fetchVoice(segs[0]) : null;
    for (let i = 0; i < segs.length; i++) {
      const blob = await next;
      if (token !== state.speakToken) return;
      next = site && i + 1 < segs.length ? fetchVoice(segs[i + 1]) : null;
      if (blob) await playBlob(blob); else await browserSpeak(segs[i].text);
      if (token !== state.speakToken) return;
    }
  }

  // --- asking a model
  async function detect() {
    try {
      if (window.claude && window.claude.use) {
        state.sample = await window.claude.use("sample");
        try { state.downloads = await window.claude.use("downloads"); } catch (_) { state.downloads = null; }
      }
    } catch (_) { state.sample = null; }
    state.mode = state.sample ? "claude" : "scribe";
    $("barSite").hidden = state.mode !== "scribe";
    $("barLocal").hidden = state.mode !== "claude";
    $("saveBook").hidden = !state.downloads;
    if (state.mode === "claude") { loadLocalBook(); } else { await loadSiteBook(); await restoreChat(); }
    setStatus("Ready"); setLiveUI();
  }
  function bookContext() {
    const t = state.book.map((p) => p.text).join("\n\n");
    return t ? "\n\nThe writer's book so far (the end of it):\n" + t.slice(-3000) : "";
  }
  async function askClaude() {
    const msgs = state.history.slice(-20).map((m) => ({ role: m.role, content: m.text }));
    while (msgs.length && msgs[0].role !== "user") msgs.shift();
    msgs[0] = { role: "user", content: INSTRUCTIONS + bookContext() + "\n\nThe conversation so far:\n\n" + msgs[0].content };
    const b = bubble("assistant", "…");
    try {
      const r = await state.sample(msgs, { cache: false, onText: ({ text }) => { b.body.textContent = text; scrollChat(); } });
      b.body.textContent = r.text; offerAdd(b);
      return { text: r.text };
    } catch (e) { b.el.remove(); throw e; }
  }
  async function askServer(text) {
    const r = await siteFetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text, session_id: state.sid, book: state.bookName }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(j.detail || "server"), { code: "server", detail: j.detail });
    return j;
  }
  function explain(e) {
    if (e && e.code === "not_granted") return "Please allow Claude to answer on this page, then press Send again.";
    if (e && e.code === "rate_limited") return "That was too fast. Wait a moment, then press Send again.";
    if (e && e.code === "auth") return "Please log in again.";
    if (e && e.detail) return e.detail;
    return "I could not get an answer. Please try again.";
  }
  function addRefButtons(b, hl) {  // under the answer: tap a passage to see it again, even in another chapter
    const row = document.createElement("div"); row.className = "refs"; row.setAttribute("aria-label", "Passages I am talking about");
    hl.forEach((h, i) => {
      const btn = document.createElement("button"); btn.type = "button"; btn.textContent = (hl.length > 1 ? `${i + 1}. ` : "Show ") + h.label;

  const zoomTo = (z) => applyLook({ ...currentLook(), zoom: z });
  const ZSTEPS = [100, 125, 150, 200, 250, 300, 400, 500];
  $("zmIn").onclick = () => zoomTo(ZSTEPS[Math.min(ZSTEPS.length - 1, ZSTEPS.indexOf(state.look.zoom) + 1)]);
  $("zmOut").onclick = () => zoomTo(ZSTEPS[Math.max(0, ZSTEPS.indexOf(state.look.zoom) - 1)]);
  $("zmLabel").onclick = () => zoomTo(100);
  $("bookWrap").addEventListener("keydown", (e) => {
    if (e.target.tagName === "TEXTAREA") return;
    if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); turnPage(1); }
    else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); turnPage(-1); }
  });
  let swipeX = null;  // a swipe left or right turns the page on a touch screen
  $("bookWrap").addEventListener("touchstart", (e) => { swipeX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  $("bookWrap").addEventListener("touchend", (e) => { if (swipeX !== null) { const dx = e.changedTouches[0].clientX - swipeX; if (Math.abs(dx) > 60) turnPage(dx < 0 ? 1 : -1); } swipeX = null; }, { passive: true });
  if (window.ResizeObserver) new ResizeObserver(() => layoutBook(true)).observe($("book"));
  $("prevCh").onclick = () => stepChapter(-1); $("nextCh").onclick = () => stepChapter(1);
  $("copyBook").onclick = copyBook; $("saveBook").onclick = saveBook; $("clearBook").onclick = clearBook;
  narrowQ.addEventListener("change", applyUI);
  window.addEventListener("resize", () => { for (const p of ["book", "chat"]) if (ui.floats[p]) placeFloat(p); });

  Object.assign(window.BS, {
    state, store, bubble, note, welcome, showServerReply, liveStop, setLiveUI, liveRunning: () => live.on, applySize, applyRead, siteFetch, loadSiteBook, setBook, setStatus, send, applyLook, currentLook,
    afterLogin: async () => { await loadSiteBook(); await restoreChat(); setStatus("Ready"); },
  });
  try { applyLook(JSON.parse(store.get("bs_look", "null")), false); } catch (_) { applySize(); }  // the login screen is already in the writer's own look
  applySize(); applyRead(); applyUI(); welcome();
  ready = detect();
})();
</script>
