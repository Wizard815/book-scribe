server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;          # voice clips and imported drafts

  # Browser hardening for the pages. (The API adds its own headers.) Fonts are the only outside resource.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  location /api/ {
    proxy_pass http://book-agent:8000;
    proxy_read_timeout 300s;         # slow inference on a cold model
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header Cache-Control "no-store" always;
  }
  # Page sources and build scripts are not part of the site.
  location ~* \.(py|fragment\.html|extra\.html)$ { return 404; }
  location / { try_files $uri /index.html; }
}
