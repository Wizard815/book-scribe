server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;          # voice clips

  location /api/ {
    proxy_pass http://book-agent:8000;
    proxy_read_timeout 300s;         # slow CPU/GPU inference on the Unraid box
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location / { try_files $uri /index.html; }
}
