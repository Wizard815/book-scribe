<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Book Scribe admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root {
  --bg: #F1F4F8; --surface: #FFFFFF; --fg: #0F1B2A; --muted: #43546A; --line: #BCC8D6;
  --accent: #1B4FD6; --accent-fg: #FFFFFF; --bad: #B3261E; --good: #1B7A43; --note: #FFF1C2; --focus: #0F1B2A;
  --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root { --bg: #0B1521; --surface: #14212F; --fg: #EEF3F8; --muted: #AFBED0; --line: #33475C; --accent: #8DB0FF; --accent-fg: #07122A; --bad: #FF9A90; --good: #7FD6A0; --note: #3B3213; --focus: #EEF3F8; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 20px/1.45 var(--font); padding: 14px max(16px, env(safe-area-inset-left, 0px)) 40px; }
main { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
h1 { margin: 0; font-size: 32px; } h2 { margin: 0 0 6px; font-size: 26px; } h3 { margin: 18px 0 4px; font-size: 22px; color: var(--accent); }
button { font: inherit; font-size: 19px; font-weight: 700; min-height: 54px; padding: 6px 18px; color: var(--fg); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; cursor: pointer; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button.danger { border-color: var(--bad); color: var(--bad); }
button[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
button:disabled { opacity: .5; cursor: default; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
input, select { font: inherit; font-size: 19px; min-height: 52px; width: 100%; padding: 8px 12px; color: var(--fg); background: var(--bg); border: 2px solid var(--line); border-radius: 10px; }
label { display: block; margin: 8px 0; color: var(--muted); font-weight: 700; }
.top { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: space-between; }
.nav { display: flex; flex-wrap: wrap; gap: 8px; }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 18px; }
.hint { color: var(--muted); margin: 4px 0; } .err { color: var(--bad); font-weight: 700; } .good { color: var(--good); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; } .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; } .kv dt { color: var(--muted); font-weight: 700; } .kv dd { margin: 0; overflow-wrap: anywhere; }
.bar { height: 22px; background: var(--bg); border: 2px solid var(--line); border-radius: 12px; overflow: hidden; } .bar > span { display: block; height: 100%; background: var(--accent); }
/* models + tiers */
.lane { border-left: 5px solid var(--accent); padding-left: 10px; margin: 10px 0; } .lane:nth-of-type(2) { border-color: #6aa9ff; } .lane:nth-of-type(3) { border-color: #c792ea; } .lane.off { border-color: var(--line); opacity: .85; }
.lane-title { font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); font-size: 16px; } .empty { color: var(--muted); font-size: 16px; }
.prof { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border: 2px solid var(--line); border-radius: 12px; margin: 8px 0; }
.prof .meta { flex: 1 1 260px; } .prof .meta small { display: block; color: var(--muted); word-break: break-all; font-size: 16px; }
.prof select { width: auto; min-height: 48px; } .badge { font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--line); margin-left: 6px; }
.badge.cloud { background: #3b2f57; color: #fff; } .badge.ok { background: #1f4d38; color: #bff3d9; } .badge.bad { background: #5a2323; color: #ffd0d0; }
.test { flex-basis: 100%; font-size: 16px; color: var(--muted); } .test.ok { color: var(--good); } .test.bad { color: var(--bad); }
.form { border: 2px dashed var(--line); border-radius: 12px; padding: 12px; margin-top: 8px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Book Scribe admin</h1>
    <div class="row" style="margin:0"><a href="/" style="color:var(--fg);font-weight:700">Back to the book</a><button type="button" id="logout" hidden>Log out</button></div>
  </div>

  <form id="login" class="card" hidden>
    <h2>Admin login</h2>
    <p class="hint" id="loginNote">This is separate from the writer's login.</p>
    <label for="lu">Admin username</label><input id="lu" type="text" autocomplete="username" autocapitalize="none" value="admin" required>
    <label for="lp">Admin password</label><input id="lp" type="password" autocomplete="current-password" required>
    <p class="err" id="loginErr" role="alert"></p>
    <div class="row"><button type="submit" class="primary" id="loginGo">Log in</button></div>
  </form>

  <div id="panel" hidden>
    <div class="nav" role="tablist" aria-label="Admin sections">
      <button type="button" role="tab" data-tab="account">Writer account</button>
      <button type="button" role="tab" data-tab="models">Models and fallbacks</button>
      <button type="button" role="tab" data-tab="embeddings">Embeddings and memory</button>
      <button type="button" role="tab" data-tab="graph">Story graph</button>
      <button type="button" role="tab" data-tab="system">System</button>
    </div>
    <p id="msg" class="err" role="alert"></p>
    <div id="view" class="card"></div>
  </div>
</main>

<script>
"use strict";
(() => {
  const $ = (id) => document.getElementById(id);
  let tab = localStorage.getItem("bs_admin_tab") || "account", poll = null;

  function h(tag, props = {}, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) k.startsWith("aria-") || k === "for" || k === "role" ? el.setAttribute(k, v) : (el[k] = v);
    el.append(...kids.filter((x) => x != null && x !== false));
    return el;
  }
  const say = (t, bad = true) => { $("msg").className = bad ? "err" : "good"; $("msg").textContent = t || ""; };
  async function api(method, path, body) {
    const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401) { showLogin("Please log in again."); throw new Error("Please log in again."); }
    if (!r.ok) throw new Error(typeof j.detail === "string" ? j.detail : "That did not work.");
    return j;
  }

  // ---- login ----------------------------------------------------------------------------------------------
  function showLogin(note, disabled) {
    $("panel").hidden = true; $("logout").hidden = true; $("login").hidden = false;
    $("loginNote").textContent = note || "This is separate from the writer's login.";
    $("loginGo").disabled = !!disabled; clearInterval(poll);
  }
  $("login").addEventListener("submit", async (e) => {
    e.preventDefault(); $("loginErr").textContent = "";
    try {
      const r = await fetch("/api/auth/admin-login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ username: $("lu").value, password: $("lp").value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { $("loginErr").textContent = typeof j.detail === "string" ? j.detail : "I could not log you in."; return; }
      $("lp").value = ""; start();
    } catch (_) { $("loginErr").textContent = "I could not reach the server."; }
  });
  $("logout").onclick = async () => { await fetch("/api/auth/logout", { method: "POST" }); location.reload(); };
  async function start() {
    const st = await (await fetch("/api/auth/status")).json().catch(() => ({}));
    if (!st.admin_enabled) return showLogin("Admin login is off. Set ADMIN_TOKEN (16 or more random characters) in .env and restart.", true);
    const me = await fetch("/api/auth/me");
    if (!me.ok || (await me.json()).role !== "admin") return showLogin();
    $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false; render(tab);
  }
  document.querySelectorAll(".nav button").forEach((b) => (b.onclick = () => render(b.dataset.tab)));
  let seq = 0;
  async function render(t) {
    const mine = ++seq;  // a slow tab must never overwrite the one the admin has moved to since
    tab = t; localStorage.setItem("bs_admin_tab", t); clearInterval(poll); say("");
    document.querySelectorAll(".nav button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.tab === t)));
    $("view").replaceChildren(h("p", { className: "hint", textContent: "Loading…" }));
    try { const dom = await { account: viewAccount, models: viewModels, embeddings: viewEmbeddings, graph: viewGraph, system: viewSystem }[t](); if (mine === seq) $("view").replaceChildren(...dom); }
    catch (e) { if (mine === seq) $("view").replaceChildren(h("p", { className: "err", textContent: e.message })); }
  }
  const when = (ts) => (ts ? new Date(ts * 1000).toLocaleString() : "never");

  // ---- writer account ----------------------------------------------------------------------------------------------
  async function viewAccount() {
    const a = await api("GET", "/api/admin/account");
    const user = h("input", { id: "au", type: "text", value: a.username || "", autocomplete: "off", autocapitalize: "none" });
    const pw = h("input", { id: "ap", type: "password", autocomplete: "new-password" });
    const save = h("button", { type: "button", className: "primary", textContent: a.exists ? "Reset the writer's login" : "Create the writer's login" });
    save.onclick = async () => {
      try { const r = await api("PUT", "/api/admin/account", { username: user.value, password: pw.value }); pw.value = ""; say(`Done. The writer logs in as ${r.username}. Anyone who was logged in has been logged out.`, false); setTimeout(() => { if (tab === "account") render("account"); }, 1200); }
      catch (e) { say(e.message); }
    };
    const del = h("button", { type: "button", className: "danger", textContent: "Remove the account" }); let armed = 0;
    del.onclick = async () => {
      if (!armed) { armed = setTimeout(() => { armed = 0; del.textContent = "Remove the account"; }, 4000); del.textContent = "Really remove? Tap again"; return; }
      await api("DELETE", "/api/admin/account"); render("account");
    };
    return [
      h("h2", { textContent: "Writer account" }),
      h("p", { className: "hint", textContent: "There is one writer account in this container. The writer signs in on the main page with this username and password. The admin login is separate and never opens the book." }),
      h("p", {}, a.exists ? h("span", { className: "good", textContent: `Account exists: ${a.username}. Last changed ${when(a.updated)}.` }) : h("span", { className: "err", textContent: "No writer account yet. Nobody can use the book until you create one." })),
      h("label", { for: "au", textContent: "Username (3 to 40 letters, numbers, dots, dashes, underscores)" }), user,
      h("label", { for: "ap", textContent: a.exists ? "New password (8 or more characters)" : "Password (8 or more characters)" }), pw,
      h("div", { className: "row" }, save, a.exists ? del : null),
    ];
  }

  // ---- models and fallbacks (tiers) ------------------------------------------------------------------------------------
  const ROLE_TITLES = {
    chat: ["Chat agent", "The model that writes and talks."],
    stt: ["Speech-to-text", "Whisper or any /v1/audio/transcriptions server."],
    tts: ["Text-to-speech", "Optional. Without one, the browser's built-in voice reads replies. List the voices it offers to give each character their own."],
    embed: ["Embeddings", "Used for finding paragraphs by meaning and for long-term memory. No fallback: different models make incompatible vectors, so only the highest-priority one is used."],
    graph: ["Story graph (graphify)", "Optional. Builds the story's relationship graph in the background. Leave empty to reuse the chat tiers."],
  };
  let snap = null, models = {};
  async function viewModels() { snap = await api("GET", "/api/admin/providers"); return modelsDom(); }
  async function act(fn) { say(""); try { await fn(); snap = await api("GET", "/api/admin/providers"); $("view").replaceChildren(...modelsDom()); } catch (e) { say(e.message); } }
  function modelsDom() {
    const inputs = snap.labels.map((l, i) => h("input", { value: l, maxLength: 30, "aria-label": `Tier ${i + 1} name` }));
    const cool = h("input", { type: "number", min: 0, max: 3600, value: snap.cooldown });
    const top = h("div", { className: "form" }, h("strong", { textContent: "Fallback tiers" }),
      h("p", { className: "hint", textContent: "A request goes to T1 first. T2 is tried only if every T1 provider failed, and T3 only after T2 failed too." }),
      h("div", { className: "row3" }, ...inputs),
      h("label", {}, "Skip a failed provider for this many seconds", cool),
      h("button", { type: "button", className: "primary", textContent: "Save tier names", onclick: () => act(() => api("PUT", "/api/admin/tier-settings", { labels: inputs.map((i) => i.value), cooldown: Number(cool.value) })) }));
    return [h("h2", { textContent: "Models and fallbacks" }), top, ...Object.keys(ROLE_TITLES).map(roleSection)];
  }
  function roleSection(role) {
    const { tiers, profiles } = snap.roles[role], byId = Object.fromEntries(profiles.map((p) => [p.id, p])), placed = new Set(tiers.flat());
    const box = h("section", {}, h("h3", { textContent: ROLE_TITLES[role][0] }), h("p", { className: "hint", textContent: ROLE_TITLES[role][1] }));
    tiers.forEach((ids, ti) => {
      const lane = h("div", { className: "lane" }, h("div", { className: "lane-title", textContent: snap.labels[ti] }));
      if (!ids.length) lane.append(h("div", { className: "empty", textContent: "nothing here" }));
      ids.forEach((id, i) => lane.append(profileRow(role, byId[id], tiers, ti, i)));
      box.append(lane);
    });
    const loose = profiles.filter((p) => !placed.has(p.id));
    if (loose.length) { const lane = h("div", { className: "lane off" }, h("div", { className: "lane-title", textContent: "Unassigned (never called)" })); loose.forEach((p) => lane.append(profileRow(role, p, tiers, -1, 0))); box.append(lane); }
    const host = h("div");
    box.append(h("button", { type: "button", textContent: "+ Add provider", onclick: () => host.replaceChildren(form(role, null, host)) }), host);
    return box;
  }
  const putTiers = (role, tiers) => act(() => api("PUT", `/api/admin/tiers/${role}`, { tiers }));
  function healthChip(p) {
    const x = p.health;
    if (!x) return h("span", { className: "badge", textContent: "not called yet" });
    if (x.cooling) return h("span", { className: "badge bad", textContent: `failing, skipped ${x.failed_ago}s ago`, title: x.error });
    if (x.error) return h("span", { className: "badge bad", textContent: "last call failed", title: x.error });
    return h("span", { className: "badge ok", textContent: `ok ${x.ok_ago}s ago` });
  }
  function profileRow(role, p, tiers, ti, i) {
    const result = h("div", { className: "test" }), lane = ti >= 0 ? tiers[ti] : [];
    const where = h("select", { "aria-label": "Tier", onchange: (e) => { const to = Number(e.target.value), t = tiers.map((x) => x.filter((id) => id !== p.id)); if (to >= 0) t[to].push(p.id); putTiers(role, t); } },
      ...snap.labels.map((l, k) => h("option", { value: k, textContent: l })), h("option", { value: -1, textContent: "Unassigned" }));
    where.value = ti;
    const shift = (d) => { const t = tiers.map((x) => [...x]); [t[ti][i], t[ti][i + d]] = [t[ti][i + d], t[ti][i]]; putTiers(role, t); };
    const editHost = h("div");
    const row = h("div", { className: "prof" },
      h("div", { className: "meta" }, h("strong", { textContent: p.label }), h("span", { className: "badge " + p.kind, textContent: p.kind }), ti >= 0 ? healthChip(p) : null,
        h("small", { textContent: `${p.base_url || "(not set)"} · ${p.model || "default model"}${p.has_key ? " · key " + p.key_hint : ""}${p.timeout ? " · " + p.timeout + "s timeout" : ""}` }),
        p.health && p.health.error ? h("small", { className: "err", textContent: p.health.error }) : null),
      ti >= 0 && i > 0 ? h("button", { type: "button", textContent: "↑", title: "Try earlier within this tier", onclick: () => shift(-1) }) : null,
      ti >= 0 && i < lane.length - 1 ? h("button", { type: "button", textContent: "↓", title: "Try later within this tier", onclick: () => shift(1) }) : null,
      where,
      h("button", { type: "button", textContent: "Test", onclick: async (ev) => {
        ev.target.disabled = true; result.className = "test"; result.textContent = "Testing…";
        try { const r = await api("POST", `/api/admin/providers/${role}/${p.id}/test`); models[`${role}:${p.id}`] = r.models || []; result.className = "test " + (r.ok ? "ok" : "bad"); result.textContent = (r.ok ? "✓ Reachable. " : "✗ ") + (r.detail || "") + (r.models.length ? ` ${r.models.length} models: ${r.models.slice(0, 8).join(", ")}${r.models.length > 8 ? "…" : ""}` : ""); }
        catch (e) { result.className = "test bad"; result.textContent = e.message; }
        ev.target.disabled = false;
      } }),
      h("button", { type: "button", textContent: "Edit", onclick: () => editHost.replaceChildren(form(role, p, editHost)) }),
      h("button", { type: "button", className: "danger", textContent: "Delete", onclick: () => confirm(`Delete "${p.label}"?`) && act(() => api("DELETE", `/api/admin/providers/${role}/${p.id}`)) }),
      result);
    return h("div", {}, row, editHost);
  }
  function form(role, p, host) {
    const f = h("form", { className: "form" });
    const field = (label, name, type = "text", { list, ...extra } = {}) => { const input = h("input", { name, type, value: (p && p[name]) || "", autocomplete: "off", ...extra }); if (list) input.setAttribute("list", list); return h("label", {}, label, input); };
    const preset = h("select", { onchange: () => {
      const x = snap.presets.find((q) => q.id === preset.value); if (!x) return;
      f.base_url.value = x.base_url; f.kind.value = x.kind; if (x.kind === "cloud" && f.tier.value === "1") f.tier.value = "3"; if (!f.label.value) f.label.value = x.label.split(" (")[0];
      if (role === "tts" && x.tts_voices) { f.voices.value = x.tts_voices; f.style_field.value = x.tts_style_field || ""; f.model.value = f.model.value || x.tts_model || ""; }
    } }, h("option", { value: "", textContent: "Start from a preset…" }), ...snap.presets.map((x) => h("option", { value: x.id, textContent: x.label })));
    const dl = h("datalist", { id: "models-" + role }); for (const m of models[`${role}:${p && p.id}`] || []) dl.append(h("option", { value: m }));
    const kind = h("select", { name: "kind" }, h("option", { value: "local", textContent: "Local" }), h("option", { value: "cloud", textContent: "Cloud / frontier" })); kind.value = (p && p.kind) || "local";
    const cur = p ? snap.roles[role].tiers.findIndex((t) => t.includes(p.id)) + 1 : 1;
    const tier = h("select", { name: "tier" }, h("option", { value: 0, textContent: "Unassigned (saved, never called)" }), ...snap.labels.map((l, k) => h("option", { value: k + 1, textContent: l }))); tier.value = cur;
    f.append(p ? null : h("label", {}, "Preset", preset), field("Name", "label", "text", { required: true }),
      h("div", { className: "row2" }, h("label", {}, "Type", kind), h("label", {}, "Tier", tier)),
      field("Base URL (no /v1). For Argos use its address, e.g. http://argos:8080", "base_url", "url", { required: true, placeholder: "http://192.168.1.10:8080" }),
      h("div", { className: "row2" }, field("Model", "model", "text", { list: "models-" + role, placeholder: role === "stt" ? "whisper-1" : "model name" }),
        field(p && p.has_key ? `API key (stored ${p.key_hint}; leave blank to keep)` : "API key (cloud only)", "api_key", "password", { value: "", autocomplete: "new-password" })),
      h("div", { className: "row2" }, field("Give up after (seconds, 0 = default)", "timeout", "number", { min: 0, max: 3600, step: 1 }), role === "tts" ? field("Default voice (used for my own speech)", "voice") : h("div")),
      role === "tts" ? field("Voices on this server: name, or name:tag/tag (male, female, neutral, low, high). Gives each character their own.", "voices", "text", { placeholder: "alloy, onyx:male/low, nova:female" }) : null,
      role === "tts" ? field("Style field (optional; OpenAI gpt-4o-mini-tts uses: instructions)", "style_field") : null, dl,
      h("div", { className: "row" }, h("button", { type: "submit", className: "primary", textContent: "Save" }), h("button", { type: "button", textContent: "Cancel", onclick: () => host.replaceChildren() })));
    f.onsubmit = (ev) => { ev.preventDefault(); const d = Object.fromEntries(new FormData(f)); d.tier = Number(d.tier); d.timeout = Number(d.timeout || 0); act(() => api("PUT", "/api/admin/providers/" + role, { ...d, id: p ? p.id : null })); };
    return f;
  }

  // ---- embeddings and memory ------------------------------------------------------------------------------------------
  async function viewEmbeddings(book) {
    clearInterval(poll);  // one refresh timer at a time: a new view must never leave the old one running
    const d = await api("GET", "/api/admin/embeddings" + (book ? `?book=${encodeURIComponent(book)}` : ""));
    const ix = d.index, pct = ix.paragraphs ? Math.round((100 * ix.indexed) / ix.paragraphs) : 0;
    const sel = h("select", { id: "eb", "aria-label": "Book", onchange: () => render2(sel.value) }, ...d.books.map((n) => h("option", { value: n, textContent: n }))); sel.value = d.book;
    const render2 = async (b) => { const dom = await viewEmbeddings(b); if (tab === "embeddings") $("view").replaceChildren(...dom); else clearInterval(poll); };
    const testOut = h("p", { className: "hint" });
    const test = h("button", { type: "button", textContent: "Test the embedding server", onclick: async () => { testOut.textContent = "Testing…"; const r = await api("POST", "/api/admin/embeddings/test"); testOut.className = r.ok ? "good" : "err"; testOut.textContent = r.ok ? `Working. It makes vectors of ${r.dims} numbers.` : r.detail; } });
    const go = (full) => async () => { await api("POST", `/api/admin/books/${encodeURIComponent(d.book)}/embeddings/rebuild`, { full }); render2(d.book); };
    if (ix.state === "running") poll = setInterval(() => render2(d.book), 1500);
    const mem = d.memory;
    return [
      h("h2", { textContent: "Embeddings" }),
      h("p", { className: "hint", textContent: "Embeddings let me find a paragraph by what it means, so “the part where the father is dismissive” works even if those words are not in the text. Without them I only match words." }),
      h("label", { for: "eb", textContent: "Book" }), sel,
      h("dl", { className: "kv", style: "margin-top:12px" },
        h("dt", { textContent: "Embedding server" }), h("dd", { textContent: ix.configured ? `${ix.provider.model} at ${ix.provider.base_url}` : "None set. Add one under Models and fallbacks > Embeddings." }),
        h("dt", { textContent: "Index" }), h("dd", { textContent: ix.ready ? `Ready. ${ix.indexed} of ${ix.paragraphs} paragraphs (${pct}%). Vectors of ${ix.dims} numbers. Built ${when(ix.built)}.` : ix.configured ? (ix.same_provider ? "Empty. Press Update index." : "Out of date: the embedding model changed. Press Rebuild from scratch.") : "Off" }),
        h("dt", { textContent: "Not yet indexed" }), h("dd", { textContent: `${ix.stale} paragraph(s)` }),
        h("dt", { textContent: "Status" }), h("dd", { className: ix.state === "error" ? "err" : "", textContent: ix.state === "running" ? `Working… ${ix.done} of ${ix.total}` : ix.state === "error" ? ix.error : ix.state === "ok" ? "Finished" : ix.state })),
      h("div", { className: "bar", style: "margin-top:10px" }, h("span", { style: `width:${pct}%` })),
      h("div", { className: "row" }, test, h("button", { type: "button", className: "primary", textContent: "Update index", disabled: !ix.configured || ix.state === "running", onclick: go(false) }),
        h("button", { type: "button", textContent: "Rebuild from scratch", disabled: !ix.configured || ix.state === "running", onclick: go(true) })), testOut,
      h("p", { className: "hint", textContent: "New and changed paragraphs are added automatically a few seconds after the writer saves. Rebuild only after changing the embedding model." }),
      h("h2", { textContent: "Long-term memory (mem0)", style: "margin-top:22px" }),
      h("dl", { className: "kv" }, h("dt", { textContent: "Storing in" }), h("dd", { textContent: mem.backend === "mem0" ? "mem0 (vectors on disk)" : mem.backend === "file" ? "A plain file (mem0 is not running)" : mem.backend }),
        mem.error ? h("dt", { textContent: "Why not mem0" }) : null, mem.error ? h("dd", { className: "err", textContent: mem.error }) : null),
      h("p", { className: "hint", textContent: "mem0 remembers what the writer likes and where new writing drifted from the story bible. It needs a working chat model and embedding server." }),
    ];
  }

  // ---- story graph ---------------------------------------------------------------------------------------------------------------
  async function viewGraph(book) {
    clearInterval(poll);
    const emb = await api("GET", "/api/admin/embeddings" + (book ? `?book=${encodeURIComponent(book)}` : ""));
    const g = await api("GET", `/api/admin/graph/${encodeURIComponent(emb.book)}`);
    const sel = h("select", { id: "gb", "aria-label": "Book", onchange: async () => $("view").replaceChildren(...(await viewGraph(sel.value))) }, ...emb.books.map((n) => h("option", { value: n, textContent: n }))); sel.value = emb.book;
    if (g.state === "running") poll = setInterval(async () => { const dom = await viewGraph(emb.book); if (tab === "graph") $("view").replaceChildren(...dom); else clearInterval(poll); }, 3000);
    return [
      h("h2", { textContent: "Story graph" }),
      h("p", { className: "hint", textContent: "graphify reads the story bible and chapters and maps who is connected to whom. It runs in the background after saves and uses the Story graph (or chat) model." }),
      h("label", { for: "gb", textContent: "Book" }), sel,
      h("dl", { className: "kv", style: "margin-top:12px" },
        h("dt", { textContent: "Built" }), h("dd", { textContent: g.built ? `Yes: ${g.nodes} things and ${g.edges} connections.` : "Not yet" }),
        h("dt", { textContent: "Status" }), h("dd", { className: g.state === "error" ? "err" : "", textContent: g.state === "running" ? "Working…" : g.state === "error" ? (g.detail || "Failed").slice(-300) : g.state === "ok" ? `Finished${g.tier ? " using " + g.tier : ""}.` : g.state })),
      h("div", { className: "row" }, h("button", { type: "button", className: "primary", textContent: "Rebuild the graph now", disabled: g.state === "running", onclick: async () => { await api("POST", `/api/admin/books/${encodeURIComponent(emb.book)}/graph/rebuild`); $("view").replaceChildren(...(await viewGraph(emb.book))); } })),
      h("p", { className: "hint", textContent: "A rebuild asks the model many questions, so it can take a while and costs tokens on a cloud model." }),
    ];
  }

  // ---- system ------------------------------------------------------------------------------------------------------------------------
  async function viewSystem() {
    const s = await api("GET", "/api/admin/status"), a = await api("GET", "/api/admin/account");
    const rows = [["Writer account", a.exists ? `Yes (${a.username})` : "None yet"], ["Chat models reachable", Array.isArray(s.llm_models) ? s.llm_models.join(", ") || "yes" : String(s.llm_models)],
      ["Text-to-speech", s.tts ? "A server voice is set up" : "None (the browser's voice is used)"], ["Memory", s.memory + (s.memory_error ? ` (${s.memory_error})` : "")],
      ["Story index", `${s.kg.characters} characters, ${s.kg.paragraphs} paragraphs`], ["Story graph", s.graph ? `${s.graph.state}, ${s.graph.nodes} things` : "-"]];
    return [h("h2", { textContent: "System" }), h("dl", { className: "kv" }, ...rows.flatMap(([k, v]) => [h("dt", { textContent: k }), h("dd", { textContent: v })])),
      h("p", { className: "hint", textContent: "Settings and keys live in data/books/.state/ inside this container's data folder. Back that folder up; it holds the writer login, voices, API keys and indexes." })];
  }

  start();
})();
</script>
</body>
</html>
