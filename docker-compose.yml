# App layer: agent API + static UI. LLM / embeddings / whisper / TTS are configured from the in-app
# admin menu (gear icon) and can be local (Unraid) or cloud. Cloudflare Tunnel runs from its own container;
# point it at http://book-ui:80 (join this compose network, or use the host port 8080).
services:
  book-agent:
    build: { context: ., dockerfile: agent/Dockerfile }
    env_file: .env
    environment:
      PROJECT_DIR: /data/books
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./data/books:/data/books          # manuscripts + .state/ (providers.json with API keys, memory)
      - ./config.yaml:/app/config.yaml:ro
    expose: ["8000"]
    restart: unless-stopped

  book-ui:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [book-agent]
    restart: unless-stopped
